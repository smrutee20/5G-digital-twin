<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IITGN 5G Twin</title>
<link rel="icon" href="data:,">
<!--
  Template for twin.html. run.py puts the 3D library (three.js, from vendor/) where LIBRARIES is, and the
  twin data and message logs where DATA is. Everything is precomputed in Python; this page only plays it back.
    left   = the 3D campus twin: buildings, sites and sectors, RSRP map, the walking phone, its serving sector
    right  = the 5G network: elements, interfaces, the current message moving along its interface
    middle = the inspector, only while something in the network is clicked: an element, a message (its live packet
             status), an interface or the message list
    bottom = what is happening now, in one line (with the live tracker of the current message), and the identities in use
-->
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f9; --panel: #ffffff; --ink: #1d2330; --ink2: #5b6475; --line: #d5dae2; --muted: #eef0f4;
  --A: #2563eb; --B: #d97706; --C: #059669; --hl: #dc2626; --n1: #7c3aed;
  --f1: #64748b; --f2: #2563eb; --f3: #0891b2; --f4: #059669; --f5: #d97706; --f6: #db2777;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; }
h1 { font-size: 17px; margin: 0 10px 0 0; }
button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.group { display: flex; gap: 4px; align-items: center; }
.setucity { margin-left: auto; display: grid; gap: 1px; text-decoration: none; color: #fff; background: var(--A); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.setucity small { font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffffffcc; }
.setucity:hover { filter: brightness(1.1); }
.small { font-size: 12px; color: var(--ink2); }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 0 16px; height: 66vh; min-height: 440px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; position: relative; overflow: hidden; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0; }
#stage { width: 100%; height: 100%; }
#stage canvas { display: block; }
/* narrow windows: one column; this must come after the #stage rule above, or that rule's height: 100% wins and the
   3D view collapses (main has no fixed height in one-column mode) */
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #stage { height: 60vh; } }
.overlay { position: absolute; background: rgba(255, 255, 255, .92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
#twinTitle { top: 10px; left: 10px; }
#signal { top: 44px; left: 10px; width: 275px; }
#signal table { border-collapse: collapse; width: 100%; margin: 4px 0; }
#signal td { padding: 1px 4px; }
#signal td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
#bar { height: 8px; border-radius: 4px; margin: 6px 0 2px; }
#barTicks { display: flex; justify-content: space-between; color: var(--ink2); }
#coreTitle { padding: 10px 12px 0; }
#net { display: block; width: 100%; height: calc(100% - 30px); }
footer { margin: 12px 16px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
#now { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#note { font-size: 16px; font-weight: 600; flex: 1 1 300px; }
.flowwrap { position: relative; display: inline-flex; align-items: center; gap: 6px; }
#noteBtn { width: 20px; height: 20px; padding: 0; border-radius: 50%; font: italic 700 12px Georgia, serif; line-height: 18px; text-align: center; }
#notePop { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 5; width: max-content; max-width: min(460px, 80vw); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 9px; color: #fff; white-space: nowrap; }
#ids { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; margin-top: 8px; }
.id { font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid transparent; }
.id b { display: block; color: var(--ink2); font-weight: 500; font-size: 11px; }
.id span { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
.id.unset span { color: var(--ink2); opacity: .5; }
.id.carried { border-color: var(--hl); background: #fdecec; }
.node rect { fill: var(--panel); stroke: var(--ink2); stroke-width: 1.2; }
.node.active rect { stroke: var(--hl); stroke-width: 2.5; }
.node text { fill: var(--ink); font-size: 13px; font-weight: 600; text-anchor: middle; }
.node text.sub { font-size: 9.5px; font-weight: 400; fill: var(--ink2); }
.link { stroke: var(--line); stroke-width: 2; fill: none; }
.link.serving { stroke-width: 4; }
.link.active { stroke: var(--hl) !important; stroke-width: 3.5; }
.link.n1 { stroke: var(--n1); stroke-dasharray: 5 4; opacity: .45; }
.link.n1.active { opacity: 1; stroke-width: 3; stroke: var(--n1) !important; }
.iflabel { font-size: 10.5px; fill: var(--ink2); text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.iflabel.active { fill: var(--hl); font-weight: 700; }
#dotlabel { font-size: 11.5px; font-weight: 700; fill: var(--hl); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
/* the Scenario box and the Strategies / What-if tabs */
[hidden] { display: none !important; }
.tabs { display: flex; gap: 0; margin-right: 6px; }
.tabs button { border-radius: 0; }
.tabs button:first-child { border-radius: 6px 0 0 6px; }
.tabs button:last-child { border-radius: 0 6px 6px 0; }
#scenario { bottom: 10px; right: 10px; line-height: 1.5; }
#uePanel { top: 54px; left: 10px; width: max-content; max-width: calc(100% - 20px); max-height: calc(100% - 64px); overflow: auto; }
#uePanel table, .pane table { border-collapse: collapse; width: 100%; margin: 4px 0; font-size: 12px; }
#uePanel td, .pane td, .pane th { padding: 1px 6px; text-align: right; white-space: nowrap; }
#uePanel td:first-child, .pane td:first-child, .pane th:first-child { text-align: left; }
.pane th { color: var(--ink2); font-weight: 600; border-bottom: 1px solid var(--line); }
.pane td.on, .pane th.on { background: #e8f0fe; font-weight: 700; }
.pane { padding: 10px 12px; height: 100%; overflow: auto; font-size: 13px; }
.pane h3 { font-size: 13px; margin: 12px 0 4px; }
/* the Configure tab */
/* in this tab the 3D view takes the full width and the settings panel sits below it */
body.cfg main { grid-template-columns: 1fr; }
body.cfg #netSection { display: none; }
#cfgBox { margin: 12px 16px 16px; }
#cfgPane { height: auto; overflow: visible; }
.cfgcols { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 3fr) minmax(0, 3fr); gap: 8px 20px; align-items: start; }
.cfgcols > div > h3:first-child, .cfgres > div > h3:first-child { margin-top: 0; }
.cfgres { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px 20px; align-items: start; margin-top: 8px; }
@media (max-width: 900px) { .cfgcols, .cfgres { grid-template-columns: 1fr; } }
#cfgCov { font-weight: 700; margin: 6px 0; } #cfgCov input { width: 64px; font: inherit; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px; }
#cfgDefaults { position: fixed; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 460px; max-width: calc(100% - 32px);
  max-height: calc(100% - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); }
#cfgDefaults table { border-collapse: collapse; width: 100%; }
#cfgDefaults td { padding: 1px 4px; vertical-align: top; }
#cfgDefaults td.changed { background: #fff3cd; font-weight: 700; }
#cfgDefClose { float: right; padding: 0 8px; }
.cfgform.cfgaz { grid-template-columns: repeat(3, auto minmax(0, 1fr)); }
.cfgform { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px; align-items: center; margin: 6px 0; }
.cfgform input, .cfgform select { font: inherit; width: 100%; min-width: 0; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.cfgrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.cfgrow input[type=number] { width: 72px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
.cfgstatus { font-size: 12px; color: var(--ink2); }
.cfgstatus.warn { color: #b45309; font-weight: 600; }
.cfgstatus.err { color: var(--hl); font-weight: 600; }
#cfgTable tr { cursor: pointer; }
#cfgTable tr.sel td { background: #fdecec; }
.alert { display: inline-block; font-size: 12px; font-weight: 600; color: #1e40af; background: #eef4ff; border: 1px solid #bfd3fb; border-radius: 6px; padding: 4px 10px; }
#uePanel.empty { width: auto; padding: 0; border: 0; background: none; }
.cfggrp { display: grid; grid-template-columns: 82px 1fr; gap: 6px 8px; align-items: center; margin: 4px 0; }
.cfggrp > span { font-size: 12px; color: var(--ink2); font-weight: 600; }
.cfggrp > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cfggrp input[type=number] { width: 64px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
/* the 5G Network Visualiser: the inspector (element / message / interface / message list) and the live packet tracker */
:root { --sel: #2563eb; --fly: #d97706; --ok: #16a34a; --cp: #4f46e5; --up: #0d9488; }
main { position: relative; }
main > section:first-child { order: 1; } #insp { order: 2; } #netSection { order: 3; }
main.insp3 { grid-template-columns: minmax(0, 1fr) 384px var(--netw); }
main.inspOver #insp { position: absolute; z-index: 6; top: 0; bottom: 0; right: calc(28px + var(--netw)); width: min(384px, calc(100% - var(--netw) - 60px)); box-shadow: 0 10px 34px rgba(15, 23, 42, .22); }
@media (max-width: 900px) { #insp { order: 4; max-height: 78vh; } }
#coreTitle { display: flex; align-items: center; gap: 10px; padding-right: 12px; }
#coreTitle .hint { flex: 1; font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#coreTitle button { padding: 2px 10px; font-size: 12px; }
.node { cursor: pointer; }
.node rect { transition: stroke-width .12s, filter .12s; }
.node.k-cp rect { fill: #f5f6ff; stroke: #6366f1; } .node.k-up rect { fill: #effcf9; stroke: var(--up); }
.node.k-dn rect { fill: #f3f5f8; stroke: #64748b; } .node.k-ue rect { fill: #fff; stroke: var(--ink); } .node.k-ran rect { fill: #fff; }
.node:hover rect { stroke-width: 2.2; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, .22)); }
.node:focus { outline: none; } .node:focus-visible rect { stroke: var(--sel) !important; stroke-width: 3; }
.node.sel rect { stroke: var(--sel) !important; stroke-width: 3; filter: drop-shadow(0 0 5px rgba(37, 99, 235, .55)); }
.node.active rect { stroke: var(--hl) !important; stroke-width: 2.5; }
.node .led { fill: #d5dae2; stroke: #fff; stroke-width: 1.2; transition: fill .2s; }
.node .led[data-st=on] { fill: var(--ok); } .node .led[data-st=warn] { fill: #f59e0b; }
.iflabel { cursor: pointer; pointer-events: all; }
.iflabel:hover, .iflabel.sel { fill: var(--sel); font-weight: 700; }
.link.sel { stroke: var(--sel); stroke-width: 3; opacity: 1; }
.link.jrn { stroke: #f59e0b; stroke-width: 3; opacity: .6; }
#pkt { cursor: pointer; }
#pkt .halo { fill: var(--hl); opacity: .2; transform-box: fill-box; transform-origin: center; animation: pkPulse 1.1s ease-in-out infinite; }
#pkt .core { fill: var(--hl); stroke: #fff; stroke-width: 1.5; transition: fill .2s; }
#pkt.landed .halo { animation: none; fill: var(--ok); opacity: .16; } #pkt.landed .core { fill: var(--ok); }
#pkt.sel .core { stroke: var(--ink); stroke-width: 2; }
@keyframes pkPulse { 0%, 100% { transform: scale(.75); } 50% { transform: scale(1.25); } }
#ripple { fill: none; stroke: var(--ok); stroke-width: 2.5; opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center; }
#ripple.go { animation: pkRipple .7s ease-out; }
@keyframes pkRipple { from { transform: scale(.35); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
#dotlabel { cursor: pointer; text-anchor: middle; }
/* the bottom line: step buttons and the live tracker of the current message */
#note { cursor: pointer; } #note:hover { color: var(--sel); } #note.quiet { font-weight: 400; font-size: 13px; color: var(--ink2); cursor: default; }
.stepbtns { display: inline-flex; gap: 2px; } .stepbtns button { padding: 0 8px; height: 22px; line-height: 20px; font-size: 12px; }
#track { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.jr { display: inline-flex; align-items: center; gap: 0; font-size: 11px; vertical-align: middle; }
.jr .jn { padding: 1px 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink) !important; font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none !important; transition: border-color .2s, background .2s; }
.jr .jn:hover { border-color: var(--sel); color: var(--sel) !important; }
.jr .jn.got, .jr .jn.from { border-color: var(--ok); background: #f0fdf4; }
.jr .jh { position: relative; width: 44px; height: 18px; cursor: pointer; flex: 0 0 auto; }
.jr .jh::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 3px; border-radius: 2px; background: var(--line); }
.jr .jh b { position: absolute; left: 0; top: 11px; height: 3px; border-radius: 2px; width: calc(var(--p, 0) * 100%); background: var(--ok); }
.jr .jh[data-st=fly] b { background: var(--fly); }
.jr .jh[data-st=fly] b::after { content: ""; position: absolute; right: -5px; top: -3.5px; width: 10px; height: 10px; border-radius: 50%; background: var(--fly); box-shadow: 0 0 0 3px rgba(217, 119, 6, .25); }
.jr .jh i { position: absolute; left: 0; right: 0; top: -2px; text-align: center; font-style: normal; font-size: 9px; color: var(--ink2); line-height: 11px; }
.jr .jh.here i { color: var(--ink); font-weight: 700; } .jr .jh.here::before, .jr .jh.here b { height: 5px; top: 10px; }
.jr .jh.here[data-st=fly] b::after { top: -2.5px; }
.jr .jh:hover i { color: var(--sel); }
.jr.big { display: flex; width: 100%; font-size: 12px; margin: 10px 0 4px; } .jr.big .jh { flex: 1 1 24px; min-width: 18px; }
.jr.big .jn { padding: 2px 8px; } .jr.big.long .jn { padding: 2px 4px; font-size: 10.5px; }
.pst { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 10px; white-space: nowrap; background: var(--muted); color: var(--ink2); }
.pst::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pst[data-st=fly] { background: #fff3e0; color: #b45309; } .pst[data-st=fly]::before { animation: pkBlink .7s ease-in-out infinite alternate; }
.pst[data-st=done] { background: #dcfce7; color: #166534; }
@keyframes pkBlink { from { opacity: .25; } to { opacity: 1; } }
/* the inspector */
#insp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; font-size: 12.5px; animation: inspIn .16s ease-out; }
@keyframes inspIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
#insp .ih { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; }
#insp .ih .crumb { flex: 1; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
#insp .ih button { padding: 1px 9px; font-size: 13px; line-height: 20px; }
#insp .ib { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 16px; }
#insp h3 { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink2); margin: 16px 0 6px; }
#insp h3 .small { text-transform: none; letter-spacing: 0; font-weight: 400; }
#insp .ttl { font-size: 17px; font-weight: 700; line-height: 1.25; word-break: break-word; }
#insp .sub { color: var(--ink2); margin-top: 2px; }
#insp .lead { margin: 8px 0 0; font-size: 13px; line-height: 1.45; }
#insp table { border-collapse: collapse; width: 100%; }
#insp td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid var(--muted); word-break: break-word; }
#insp td:first-child { color: var(--ink2); width: 42%; }
#insp tr.carried td { background: #fdf3f3; }
#insp .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
#insp a, .pklink { color: var(--A); cursor: pointer; text-decoration: none; } #insp a:hover { text-decoration: underline; }
.kindtag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; background: var(--muted); color: var(--ink2); margin: 0 4px 4px 0; }
.kindtag.k-cp { background: #eef0ff; color: var(--cp); } .kindtag.k-up { background: #e3faf5; color: #0f766e; } .kindtag.k-ue { background: var(--ink); color: #fff; }
.kindtag.k-ran { background: #fff4e0; color: #b45309; } .kindtag.nas { background: #f1eaff; color: var(--n1); }
.pk { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
.pk.real { background: #dcfce7; color: #166534; } .pk.sim { background: #eef0f4; color: var(--ink2); } .pk.new { background: #fdecec; color: var(--hl); }
/* live packet status */
.hero { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; background: #fafbfc; transition: background .25s, border-color .25s; }
.hero[data-st=fly] { background: #fffaf2; border-color: #fbbf77; } .hero[data-st=done] { background: #f4fcf6; border-color: #9fdcb1; }
.hero .herotop { display: flex; align-items: center; gap: 8px; }
.hero .lbl { flex: 1; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink2); }
.badge2 { font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink2); }
.badge2.live { border-color: #fca5a5; color: var(--hl); background: #fff5f5; }
.hero .bigst { margin: 8px 0 2px; } .hero .bigst .pst { font-size: 14px; padding: 4px 12px; border-radius: 14px; }
.hero .times { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; font-size: 11.5px; color: var(--ink2); margin-top: 4px; font-variant-numeric: tabular-nums; }
.hero .times b { display: block; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; } .hero .times > span:nth-child(2) { text-align: center; } .hero .times > span:last-child { text-align: right; }
.hero .times span > span { color: var(--ink); font-weight: 600; }
.hero .ctl { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; } .hero .ctl button { flex: 1 1 auto; padding: 3px 6px; font-size: 12px; white-space: nowrap; }
.hero .hopline { font-size: 11.5px; color: var(--ink2); }
/* cause and effect: a small vertical timeline */
.cz { display: grid; grid-template-columns: 16px 1fr auto; gap: 0 8px; padding: 5px 6px 5px 2px; border-radius: 7px; cursor: pointer; position: relative; color: inherit !important; text-decoration: none !important; }
.cz:hover { background: var(--muted); } .cz.here { background: #eef4ff; }
.cz .rail { position: relative; } .cz .rail::before { content: ""; position: absolute; left: 7px; top: -5px; bottom: -5px; width: 2px; background: var(--line); }
.cz:first-child .rail::before { top: 8px; } .cz:last-child .rail::before { bottom: calc(100% - 8px); } .cz:only-child .rail::before { display: none; }
.cz .rail i { position: absolute; left: 3px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid #b6bdc9; }
.cz .rail i[data-st=done] { background: var(--ok); border-color: var(--ok); } .cz .rail i[data-st=fly] { background: var(--fly); border-color: var(--fly); box-shadow: 0 0 0 3px rgba(217, 119, 6, .22); }
.cz .who { font-weight: 600; } .cz .what { color: var(--ink2); font-size: 11.5px; word-break: break-word; } .cz.here .what { color: var(--ink); }
.cz .when { font-size: 11px; color: var(--ink2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cz .role { display: block; font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; color: var(--ink2); }
.ifc { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--muted); color: var(--ink2); font-family: ui-monospace, Menlo, Consolas, monospace; }
/* encapsulation: nested layers, outermost first */

.encap .ly > span { display: flex; gap: 6px; align-items: baseline; font-size: 11px; margin-bottom: 3px; } .encap .ly > span b { color: var(--lc, var(--ink2)); font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
.encap .ly > span em { font-style: normal; color: var(--ink); font-weight: 600; word-break: break-word; }
.encap .ly.leaf { padding-bottom: 3px; } .encap .ly.leaf > span { margin-bottom: 0; }
.stack { display: flex; flex-wrap: wrap; gap: 3px; } .stack span { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
/* an element's state machines and protocol stacks */
.sm { display: grid; grid-template-columns: 104px 1fr; gap: 4px 8px; align-items: center; margin: 5px 0; }
.sm .k { color: var(--ink2); } .sm .sts { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.sm .st { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: #9aa3b2; background: var(--panel); white-space: nowrap; }
.sm .st.on { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; } .sm .st.on.warn { background: #f59e0b; border-color: #f59e0b; } .sm .st.on.off { background: #64748b; border-color: #64748b; }
.sm .arr { color: #b6bdc9; font-size: 10px; }
.stacks { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }

.stk.lit { border-color: var(--hl); background: #fff7f7; box-shadow: 0 0 0 2px rgba(220, 38, 38, .12); }

.mlist .mr:hover { background: var(--muted); } .mlist .mr[data-st=future] { opacity: .5; } .mlist .mr.cur { background: #eef4ff; border-left-color: var(--sel); opacity: 1; }

.wstree { font: 11.5px/1.45 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin-top: 4px; }

.wstree summary { cursor: pointer; white-space: pre-wrap; word-break: break-all; }

/* campus layers */

#infoPanel h2 { margin: 8px 0 2px; } #infoPanel h2:first-child { margin-top: 0; }
#infoPanel table { border-collapse: collapse; margin-top: 4px; } #infoPanel td, #infoPanel th { padding: 0 10px 0 0; text-align: left; }
/* the RSRP colour bars appear only while the radio heat map is on */

#layerBar label { gap: 3px; } #layerBar input { margin: 0; }

<!--LIBRARIES-->
<script>
const DATA = /*DATA*/null;
// The local server (python -m server) for the Configure tab and other handover rules. tools/build_site.py sets
// STATIC_SITE = true for the GitHub Pages copy (docs/index.html): no server there, so the page never calls one.
const STATIC_SITE = false;
const SERVER = STATIC_SITE ? null : location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8765";
const T = DATA.twin, SECTORS = T.sectors, NAMES = SECTORS.map(s => s.name);
// Display names only: sectors are numbered by azimuth within each site (A60 -> A1 ...); the data and the server keep
// the original IDs. The baseline strategies B1/B2 are shown as Fixed/Random (so they do not clash with sectors B1/B2).
const SECTOR_LABEL = { A60: "A1", A180: "A2", A300: "A3", B105: "B1", B225: "B2", B345: "B3", C53: "C1", C173: "C2", C293: "C3" };
const sn = n => SECTOR_LABEL[n] || n;
const snText = t => String(t ?? "").replace(/\b(A60|A180|A300|B105|B225|B345|C53|C173|C293)\b/g, m => SECTOR_LABEL[m]);
const STRATEGY_LABEL = { B1: "Fixed", B2: "Random" };
const stn = n => STRATEGY_LABEL[n] || n;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const siteColor = site => css(`--${site}`);
const pretty = s => s.replace(/([a-z])([A-Z])/g, "$1 $2");
const msgName = e => e.message.replace("GTP_U", "GTP-U") + (e.nas ? ` [NAS: ${pretty(e.nas)}]` : "");

// ======================================================================= LEFT: the 3D twin (three.js)
const V = (x, y, z) => new THREE.Vector3(x, z, -y);          // twin: x east, y north, z up -> three.js: y up
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f6);
scene.fog = new THREE.Fog(0xeef2f6, 1800, 4200);
const camera = new THREE.PerspectiveCamera(42, 1, 1, 8000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c0c8, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-600, 1200, 800); scene.add(sun);

// ground and the RSRP map (a picture of the ray-traced best-sector RSRP, laid on the ground)
const [mx0, mx1, my0, my1] = T.rsrp_map.extent;
const ground = new THREE.Mesh(new THREE.PlaneGeometry((mx1 - mx0) * 1.5, (my1 - my0) * 1.5), new THREE.MeshLambertMaterial({ color: 0xe3e7ec }));
ground.rotation.x = -Math.PI / 2; ground.position.copy(V((mx0 + mx1) / 2, (my0 + my1) / 2, -0.1)); scene.add(ground);
const mapTex = new THREE.TextureLoader().load(T.rsrp_map.png);
mapTex.magFilter = THREE.NearestFilter;
const map = new THREE.Mesh(new THREE.PlaneGeometry(mx1 - mx0, my1 - my0), new THREE.MeshBasicMaterial({ map: mapTex, transparent: true, depthWrite: false }));
map.rotation.x = -Math.PI / 2; map.position.copy(V((mx0 + mx1) / 2, (my0 + my1) / 2, 0.2)); scene.add(map);

// buildings: one mesh from the scene's corner points and triangles
const decode = (s, Type) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Type(u.buffer); };
{
  const p = decode(T.buildings.points, Float32Array), q = new Float32Array(p.length);
  for (let i = 0; i < p.length; i += 3) { q[i] = p[i]; q[i + 1] = p[i + 2]; q[i + 2] = -p[i + 1]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(q, 3));
  g.setIndex(new THREE.BufferAttribute(decode(T.buildings.triangles, Uint32Array), 1));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xbdb7ae, roughness: 0.9, flatShading: true, side: THREE.DoubleSide })));
}

// text labels that always face the camera
function label(text, color, size) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const x = c.getContext("2d"); x.font = "700 36px system-ui, sans-serif"; x.textAlign = "center";
  x.lineWidth = 8; x.strokeStyle = "rgba(255,255,255,0.95)"; x.strokeText(text, 128, 46); x.fillStyle = color; x.fillText(text, 128, 46);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(size * 4, size, 1); s.renderOrder = 10; return s;
}

// sites (mast + head + label) and sectors (an arrow in the direction the antenna points + its name)
for (const [site, s] of Object.entries(T.sites)) {
  const [x, y] = s.xy, h = s.height_m;
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2, h, 10), new THREE.MeshStandardMaterial({ color: 0x8a939e }));
  mast.position.copy(V(x, y, h / 2)); scene.add(mast);
  const head = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 12), new THREE.MeshBasicMaterial({ color: siteColor(site) }));
  head.position.copy(V(x, y, h)); scene.add(head);
  const l = label(`Site ${site} · gNB-${site}`, siteColor(site), 46); l.position.copy(V(x, y, h + 70)); scene.add(l);
}
for (const s of SECTORS) {
  const a = s.az * Math.PI / 180, t = s.tilt * Math.PI / 180;
  const dir = V(Math.cos(a) * Math.cos(t), Math.sin(a) * Math.cos(t), -Math.sin(t)).normalize();
  scene.add(new THREE.ArrowHelper(dir, V(...s.pos), 60, new THREE.Color(siteColor(s.site)).getHex(), 14, 9));
  const l = label(sn(s.name), siteColor(s.site), 26); l.position.copy(V(...s.pos).add(dir.clone().multiplyScalar(80))); scene.add(l);
}

// the walking person with the phone, its route (dots on the road), and the line from the phone to its serving sector.
// The person is drawn PERSON_SCALE x real size (a 1.75 m person -> 7 m) so it can be seen from the overview;
// the radio always uses the phone at 1.5 m (twin/scene.py UE_HEIGHT_M).
const PERSON_SCALE = 4;
function makePerson() {
  const g = new THREE.Group(), mat = c => new THREE.MeshLambertMaterial({ color: c });
  const skin = mat(0xc68a5a), shirt = mat(0xdc2626), trousers = mat(0x1f3a5f), shoes = mat(0x1d2330);
  const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  // metres of a 1.75 m person; local +x = forward, +y = up, z = sideways
  const torso = box(0.24, 0.58, 0.40, shirt); torso.position.y = 1.18;
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), skin); head.position.y = 1.62;
  const hair = new THREE.Mesh(new THREE.IcosahedronGeometry(0.135, 1), mat(0x2b2118));
  hair.scale.set(1, 0.6, 1); hair.position.set(-0.02, 1.68, 0);
  const limb = (y, z, len, w, m, foot) => {                  // a pivot (hip or shoulder) with the limb hanging below
    const p = new THREE.Group(); p.position.set(0, y, z);
    const l = box(w, len, w, m); l.position.y = -len / 2; p.add(l);
    if (foot) { const f = box(0.24, 0.07, 0.12, shoes); f.position.set(0.05, -len, 0); p.add(f); }
    return p;
  };
  const legL = limb(0.89, 0.1, 0.86, 0.15, trousers, true), legR = limb(0.89, -0.1, 0.86, 0.15, trousers, true);
  const armL = limb(1.43, 0.26, 0.6, 0.1, shirt), armR = limb(1.43, -0.26, 0.6, 0.1, shirt);
  const hand = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), skin); hand.position.y = -0.62; armR.add(hand);
  const phone = new THREE.Group(); phone.position.set(0.02, -0.66, 0);    // in the right hand, screen up to the face
  const body = box(0.02, 0.16, 0.08, mat(0x111827)); phone.add(body);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 0.065), new THREE.MeshBasicMaterial({ color: 0x60a5fa, side: THREE.DoubleSide }));
  screen.rotation.y = -Math.PI / 2; screen.position.x = -0.012; phone.add(screen);
  phone.rotation.z = -0.6; armR.add(phone);
  armR.rotation.z = 1.15;                                     // forearm forward: holding the phone in front
  [head, hair, legL, legR, armL, armR].forEach(o => o.castShadow = false);
  g.add(torso, head, hair, legL, legR, armL, armR);
  g.scale.setScalar(PERSON_SCALE);
  g.userData = { legL, legR, armL, phone, screen };
  return g;
}
const walker = makePerson();
const halo = new THREE.Mesh(new THREE.RingGeometry(8, 11, 48), new THREE.MeshBasicMaterial({ color: 0xdc2626, side: THREE.DoubleSide, transparent: true }));
halo.rotation.x = -Math.PI / 2;
const servLine = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1, 8, 1, true), new THREE.MeshBasicMaterial({ color: 0x2563eb, transparent: true }));
const routeGroup = new THREE.Group();
scene.add(walker, halo, servLine, routeGroup);
// motion state: the person walks smoothly to each step's point; legs swing with the distance walked
const WALK = { pos: new THREE.Vector3(), target: new THREE.Vector3(), heading: 0, targetHeading: 0, phase: 0,
               sector: null, opacity: 1, flashAt: -1e9, last: performance.now(), shownIndex: -1, servingShown: null };
function placeLine(mesh, a, b) {                           // stretch a thin cylinder from point a to point b
  const d = b.clone().sub(a);
  mesh.scale.set(1, d.length(), 1);
  mesh.position.copy(a).add(d.clone().multiplyScalar(0.5));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}

// ======================================================================= RIGHT: the 5G network (SVG)
const svg = document.getElementById("net"), NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const POS = {
  UE: [55, 240, "UE", "phone"], "gNB-A": [200, 100, "gNB-A", "site A"], "gNB-B": [200, 240, "gNB-B", "site B"],
  "gNB-C": [200, 380, "gNB-C", "site C"], AMF: [380, 100, "AMF", "access & mobility"], SMF: [380, 240, "SMF", "sessions"],
  UPF: [380, 380, "UPF", "user plane"], AUSF: [495, 45, "AUSF", "authentication"], NSSF: [500, 160, "NSSF", "slice selection"],
  UDM: [625, 45, "UDM", "subscribers"], SIDF: [625, 102, "SIDF", "SUCI → SUPI"], Internet: [560, 380, "Internet", "server"],
};
const LINKS = [
  ["UE", "gNB-A", "Uu"], ["UE", "gNB-B", "Uu"], ["UE", "gNB-C", "Uu"],
  ["gNB-A", "gNB-B", "Xn"], ["gNB-B", "gNB-C", "Xn"], ["gNB-A", "gNB-C", "Xn", "M200,100 Q330,240 200,380"],
  ["gNB-A", "AMF", "N2"], ["gNB-B", "AMF", "N2"], ["gNB-C", "AMF", "N2"],
  ["gNB-A", "UPF", "N3"], ["gNB-B", "UPF", "N3"], ["gNB-C", "UPF", "N3"],
  ["AMF", "SMF", "N11"], ["SMF", "UPF", "N4"], ["UPF", "Internet", "N6"],
  ["AMF", "AUSF", "SBI"], ["AUSF", "UDM", "SBI"], ["AMF", "NSSF", "SBI"], ["UDM", "SIDF", ""],
  ["UE", "AMF", "N1", "M55,240 C60,10 330,10 380,100"],
];
const key = (a, b) => [a, b].sort().join("|");
const linkEl = {}, labelEl = {}, nodeEl = {};
el("rect", { x: 577, y: 22, width: 96, height: 106, rx: 8, fill: "none", stroke: css("--ink2"), "stroke-dasharray": "3 3" }, svg);  // UDM holds the SIDF
for (const [a, b, iface, d] of LINKS) {
  const k = iface === "N1" ? "N1" : key(a, b);
  linkEl[k] = el("path", { d: d || `M${POS[a][0]},${POS[a][1]} L${POS[b][0]},${POS[b][1]}`, class: "link" + (iface === "N1" ? " n1" : "") }, svg);
}
for (const [a, b, iface] of LINKS) {
  if (!iface) continue;
  const k = iface === "N1" ? "N1" : key(a, b), p = linkEl[k];
  const at = p.getPointAtLength(p.getTotalLength() * (iface === "Uu" ? 0.4 : 0.5));
  labelEl[k] = el("text", { x: at.x, y: at.y + 4, class: "iflabel" }, svg);
  labelEl[k].textContent = iface === "N1" ? "N1 (NAS, carried over Uu + N2)" : iface;
}
// a node: its box (tinted by kind: phone, radio, control plane, user plane, data network), its name, a line of text
// below it and a small light that shows whether it holds live state for the phone (set by the visualiser script)
const ledEl = {}, subEl = {};
for (const [name, [x, y, title, sub]] of Object.entries(POS)) {
  const kind = name === "UE" ? "ue" : name.startsWith("gNB") ? "ran" : name === "UPF" ? "up" : name === "Internet" ? "dn" : "cp";
  const g = el("g", { class: "node k-" + kind }, svg), w = name === "SIDF" ? 80 : 92, h = name === "SIDF" ? 36 : 42;
  const r = el("rect", { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 7 }, g);
  if (name.startsWith("gNB")) r.style.stroke = siteColor(name.slice(-1));
  el("text", { x, y: y - 2 }, g).textContent = title;
  subEl[name] = el("text", { x, y: y + 12, class: "sub" }, g); subEl[name].textContent = sub;
  ledEl[name] = el("circle", { cx: x + w / 2 - 8, cy: y - h / 2 + 8, r: 3.5, class: "led" }, g);
  el("title", {}, ledEl[name]);
  nodeEl[name] = g;
}
// the message on its way: a pulsing packet that turns green when it lands, and a ring at the element it reaches
const ripple = el("circle", { id: "ripple", r: 30 }, svg);
const dot = el("g", { id: "pkt" }, svg);
el("circle", { r: 13, class: "halo" }, dot); el("circle", { r: 7, class: "core" }, dot); el("circle", { r: 17, fill: "transparent" }, dot);
const dotLabel = el("text", { id: "dotlabel" }, svg);

// ======================================================================= BOTTOM: identities
const idEl = {};
for (const [k, name] of Object.entries(DATA.identities)) {
  const d = document.createElement("div"); d.className = "id"; d.innerHTML = `<b>${name}</b><span></span>`;
  document.getElementById("ids").appendChild(d); idEl[k] = d;
}

// ======================================================================= the shared timeline
// Each route has one log: walk steps, messages and notes in time order. Showing entry i updates all three areas.
let route, log, cur = 0, playing = false, timer = null, anim = null, view = "overview";
const routeSel = document.getElementById("route");
for (const r of T.routes) {
  routeSel.add(new Option(r.name || `Route ${r.id}`, r.id));
}
const speed = () => +document.getElementById("speed").value;
const duration = e => (e.kind === "step" ? 170 : e.kind === "info" ? 1500 : e.flow === 4 ? 320 : 900) / speed();

// ---- the handover rule (event A3): offset (dB) and time-to-trigger (steps); the study used 3 dB / 2 steps.
// The serving sector along the route is recomputed here from the route's saved, ray-traced RSRP (the same rule as
// run.py and task 10); the message timeline for a new rule comes from the server (POST /timeline, run.py's network
// simulation). Offline (no server) the route colours and counts follow the new rule, the messages stay 3 dB / 2 steps.
const STUDY_RULE = { off: 3, ttt: 2 };
const RULE = { ...STUDY_RULE };
const ruleKey = (id, r = RULE) => `${id}|${r.off}|${r.ttt}`;
const LOGS = {};                                            // timelines per route and rule
for (const id in DATA.logs) LOGS[ruleKey(id, STUDY_RULE)] = DATA.logs[id];
function a3(rsrp, off, ttt) {
  const arg = v => v.reduce((b, x, i) => x > v[b] ? i : b, 0);
  let serving = arg(rsrp[0]), cand = null, count = 0;
  const path = [serving], handovers = [];
  for (let k = 1; k < rsrp.length; k++) {
    const best = arg(rsrp[k]);
    if (best !== serving && rsrp[k][best] > rsrp[k][serving] + off) { count = best === cand ? count + 1 : 1; cand = best; }
    else { count = 0; cand = null; }
    if (count >= ttt) { handovers.push({ step: k, from: NAMES[serving], to: NAMES[best] }); serving = best; cand = null; count = 0; }
    path.push(serving);
  }
  return { path, handovers };
}
async function timelineFor(id) {                           // the log for this route under the current rule
  const k = ruleKey(id);
  if (!LOGS[k]) {
    if (SERVER == null) throw new Error("no server on the static site");
    const r = await fetch(SERVER + "/timeline", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ route: +id, offset_db: RULE.off, ttt_steps: RULE.ttt }) });
    if (!r.ok) throw new Error(`server: ${r.status}`);
    LOGS[k] = (await r.json()).log;
  }
  return LOGS[k];
}

function drawRoute() {                                      // dots coloured by the serving site under the current rule
  routeGroup.clear();
  const A = a3(route.rsrp, RULE.off, RULE.ttt);
  const every = Math.max(1, Math.round(4 / DATA.step_m)), idx = route.points.map((p, i) => i).filter(i => i % every === 0);
  const dots = new THREE.InstancedMesh(new THREE.CircleGeometry(1.4, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }), idx.length);
  const M = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2), one = new THREE.Vector3(1, 1, 1);
  idx.forEach((k, i) => {
    const p = route.points[k]; M.compose(V(p[0], p[1], 0.5), q, one); dots.setMatrixAt(i, M);
    dots.setColorAt(i, new THREE.Color(siteColor(SECTORS[A.path[k]].site)));
  });
  routeGroup.add(dots);
  for (const h of A.handovers) {                            // a ring where each handover happens, in the new site's colour
    const p = route.points[h.step], site = h.to[0], xn = h.from[0] !== site;
    const m = new THREE.Mesh(new THREE.RingGeometry(xn ? 4 : 3, xn ? 5.6 : 3.8, 32),
                             new THREE.MeshBasicMaterial({ color: siteColor(site), side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.copy(V(p[0], p[1], 0.6)); routeGroup.add(m);
  }
  for (const [p, c] of [[route.points[0], 0x16a34a], [route.points[route.points.length - 1], 0x1d2330]]) {   // start, end
    const m = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.6, 24), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.copy(V(p[0], p[1], 0.55)); routeGroup.add(m);
  }
  const xn = A.handovers.filter(h => h.from[0] !== h.to[0]).length, n = A.handovers.length;
  const c = document.getElementById("a3count");
  c.className = ""; c.textContent = "";
  c.title = `${n} handover${n === 1 ? "" : "s"} (${xn} Xn): ` + A.handovers.map(h => `${sn(h.from)}→${sn(h.to)} at ${h.step * DATA.step_m} m`).join(", ") || "no handover";
  return A;
}

let routeToken = 0;
async function setRoute(id, step = 0) {
  const token = ++routeToken;
  route = T.routes.find(r => r.id == id); routeSel.value = id;
  drawRoute();
  log = LOGS[ruleKey(id, STUDY_RULE)];
  try { const l = await timelineFor(id); if (token !== routeToken) return; log = l; }
  catch (err) {
    if (token !== routeToken) return;
    const c = document.getElementById("a3count");
    c.className = "warn"; c.textContent = "needs server"; c.title = "messages need the server (python -m server); they still follow 3 dB / 2 steps";
  }
  WALK.shownIndex = -1; WALK.servingShown = null;
  cur = Math.max(0, log.findIndex(e => e.step >= step));
  setView(view);
  go(cur, false);
}
function setRule() {
  const off = +document.getElementById("a3off").value, ttt = Math.round(+document.getElementById("a3ttt").value);
  if (!(off >= 0 && off <= 20 && ttt >= 1 && ttt <= 20)) return;
  RULE.off = off; RULE.ttt = ttt;
  const step = log && log[cur] ? log[cur].step : 0;
  if (playing) go(cur, false);
  setRoute(route.id, step);                                 // same place on the walk, new serving sector and messages
}
document.getElementById("a3off").onchange = document.getElementById("a3ttt").onchange = setRule;
// keep Info's "Now:" line current
["a3off", "a3ttt"].forEach(i => document.getElementById(i).addEventListener("change", () => typeof applyLayers === "function" && applyLayers()));

function showTwin(e) {
  const k = e.step, [x, y] = route.points[k];
  // where the person walks to, and which way it faces (along the route)
  const P = route.points, a = P[Math.max(0, k - 1)], b = P[Math.min(P.length - 1, k + 1)];
  WALK.target.copy(V(x, y, 0));
  if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.1) WALK.targetHeading = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const next = cur === WALK.shownIndex + 1;                  // played forward by one entry (not a jump)
  if (!next || WALK.pos.distanceTo(WALK.target) > 12) {      // a jump: no walking animation
    WALK.pos.copy(WALK.target); WALK.heading = WALK.targetHeading;
    if (view === "follow") followCamera(k);
  }
  const s = SECTORS.find(s => s.name === e.serving);
  if (next && s && WALK.servingShown && WALK.servingShown !== e.serving) WALK.flashAt = performance.now();   // handover
  WALK.shownIndex = cur; WALK.servingShown = e.serving || null;
  WALK.sector = s || null;
  WALK.opacity = e.ue_state === "RRC connected" ? 1 : 0.35;    // faint while idle (camping only)
  if (s) { servLine.material.color.set(siteColor(s.site)); halo.material.color.set(siteColor(s.site)); walker.userData.screen.material.color.set(siteColor(s.site)); }
  // small panel: the 3 strongest sectors here, and the serving one
  const rs = route.rsrp[k], order = NAMES.map((n, i) => i).sort((a, b) => rs[b] - rs[a]).slice(0, 3);
  const row = i => `<tr><td><span class="dot" style="background:${siteColor(SECTORS[i].site)}"></span>${sn(NAMES[i])}</td>
    <td class="v">${rs[i].toFixed(1)} dBm</td><td>${!route.los[k][i] ? "blocked" : route.los_clear && !route.los_clear[k][i] ? "line of sight through trees" : "line of sight"}${route.traced[k][i] ? "" : " · 3GPP fill"}</td></tr>`;
  const si = NAMES.indexOf(e.serving);
  const [lo, hi] = T.rsrp_map.dbm;
  document.getElementById("signal").innerHTML =
    `<b>Strongest sectors here</b> <span class="small">(step ${k} · ${k * DATA.step_m} m)</span>
     <table>${order.map(row).join("")}</table>
     <b>Serving sector:</b> ${si < 0 ? "none yet" : `${sn(e.serving)} on gNB-${e.serving[0]} · ${rs[si].toFixed(1)} dBm`}
     <div class="small">${e.ue_state === "off" ? "phone switching on" : e.ue_state}</div>
     <div id="bar" style="background:linear-gradient(90deg,${T.rsrp_map.colors.join(",")})"></div>
     <div id="barTicks" class="small"><span>${lo}</span><span>RSRP map, best sector (dBm)</span><span>${hi}</span></div>`;
}

function showCore(e) {
  Object.values(linkEl).forEach(p => { p.classList.remove("active", "serving"); p.style.stroke = ""; p.style.strokeDasharray = ""; });
  Object.values(labelEl).forEach(p => p.classList.remove("active"));
  Object.values(nodeEl).forEach(g => g.classList.remove("active"));
  if (e.serving) {                                         // the phone's radio link to its serving gNB
    const p = linkEl[key("UE", "gNB-" + e.serving[0])];
    p.classList.add("serving"); p.style.stroke = siteColor(e.serving[0]);
    if (e.ue_state !== "RRC connected") p.style.strokeDasharray = "6 5";
  }
  dot.style.display = dotLabel.style.display = "none";
  if (e.kind !== "msg") return;
  const k = key(e.src, e.dst);
  linkEl[k]?.classList.add("active"); labelEl[k]?.classList.add("active");
  if (e.nas) { linkEl.N1.classList.add("active"); labelEl.N1.classList.add("active"); }
  nodeEl[e.src].classList.add("active"); nodeEl[e.dst].classList.add("active");
}

function showBottom(e) {
  const f = document.getElementById("flow");
  f.textContent = `Flow ${e.flow}: ${DATA.flows[e.flow]}`; f.style.background = css(`--f${e.flow}`);
  const note = document.getElementById("note");                 // a message by name; a walk step or a remark in lighter text
  note.textContent = e.kind === "msg" ? `${msgName(e)} (${e.interface})` : snText(e.note);
  note.classList.toggle("quiet", e.kind !== "msg");
  document.getElementById("notePop").textContent = snText(e.note);
  document.getElementById("time").textContent = `t = ${(e.t / 1000).toFixed(3)} s`;
  for (const [k, d] of Object.entries(idEl)) {
    const v = e.ids[k];
    d.querySelector("span").textContent = v === undefined ? "not in use" : v;
    d.classList.toggle("unset", v === undefined);
    d.classList.toggle("carried", e.kind === "msg" && e.carries.includes(k));
  }
}

// The message on screen (its index in the log) and how far it has flown, 0..1: the live packet status reads this.
const FLIGHT = { i: -1, f: 1 };
// Where the packet's name goes: next to the packet (above, below, to its left or right), in the first place where
// it covers no element and no interface label; it stays where it is until that place is taken. If no place is free,
// the one that covers least (an element counts 10 times an interface label).
const NODE_BOXES = Object.entries(POS).map(([n, [x, y]]) => { const w = n === "SIDF" ? 40 : 46, h = n === "SIDF" ? 18 : 21; return [x - w, y - h, x + w, y + h, 10]; });
const LABEL_SPOTS = [-18, 28, -32, 42, -46, 56].flatMap(dy => [0, -1, 1].map(side => [side, dy]));
let labelBoxes = null;
function obstacles() {
  if (!labelBoxes) try {                                    // measured once, when the diagram is on screen
    const b = Object.values(labelEl).map(l => { const r = l.getBBox(); return [r.x, r.y, r.x + r.width, r.y + r.height, 1]; });
    if (b.every(r => r[2] > r[0])) labelBoxes = b;
  } catch (err) {}
  return labelBoxes ? NODE_BOXES.concat(labelBoxes) : NODE_BOXES;
}
function labelSpot(pt, half, last) {
  const boxes = obstacles();
  let best = null, least = Infinity;
  for (const s of last ? [last, ...LABEL_SPOTS] : LABEL_SPOTS) {
    const cx = pt.x + s[0] * (half + 8), x0 = cx - half, x1 = cx + half, y = pt.y + s[1];
    if (x0 < 2 || x1 > 678 || y < 14 || y > 464) continue;
    let covered = 0;
    for (const r of boxes) if (x0 < r[2] + 3 && x1 > r[0] - 3 && y - 12 < r[3] && y + 4 > r[1]) covered += r[4];
    if (!covered) return s;
    if (covered < least) { best = s; least = covered; }
  }
  return best || last || LABEL_SPOTS[0];
}
function animateDot(e, ms) {                               // the message travels along its interface
  cancelAnimationFrame(anim);
  dot.classList.remove("landed"); ripple.classList.remove("go");
  const p = e.kind === "msg" && linkEl[key(e.src, e.dst)];
  if (!p) { FLIGHT.f = 1; return; }
  const L = p.getTotalLength(), start = p.getPointAtLength(0);
  const forward = Math.hypot(start.x - POS[e.src][0], start.y - POS[e.src][1]) < 1;
  const at = s => p.getPointAtLength(L * (forward ? s : 1 - s));
  // it leaves the edge of the sender's box and stops at the edge of the receiver's, so it never hides a name
  const inBox = (pt, n) => Math.abs(pt.x - POS[n][0]) < (n === "SIDF" ? 40 : 46) + 9 && Math.abs(pt.y - POS[n][1]) < (n === "SIDF" ? 18 : 21) + 9;
  let a = 0, b = 1;
  while (a < 0.45 && inBox(at(a), e.src)) a += 0.01;
  while (b > 0.55 && inBox(at(b), e.dst)) b -= 0.01;
  dot.style.display = dotLabel.style.display = ""; dotLabel.textContent = msgName(e);
  const half = dotLabel.getComputedTextLength() / 2 + 6;
  let spot = null;
  const t0 = performance.now();
  const frame = now => {
    const f = Math.max(0, Math.min(1, (now - t0) / (ms * 0.8))), pt = at(a + (b - a) * f);
    dot.setAttribute("transform", `translate(${pt.x},${pt.y})`);
    spot = labelSpot(pt, half, spot);
    dotLabel.setAttribute("x", Math.max(half, Math.min(680 - half, pt.x + spot[0] * (half + 8)))); dotLabel.setAttribute("y", pt.y + spot[1]);
    FLIGHT.f = f;
    if (f < 1) anim = requestAnimationFrame(frame);
    else {                                                  // delivered: the packet turns green, a ring spreads at the receiver
      dot.classList.add("landed");
      ripple.setAttribute("cx", POS[e.dst][0]); ripple.setAttribute("cy", POS[e.dst][1]);
      ripple.getBoundingClientRect(); ripple.classList.add("go");
    }
    if (typeof nfLive === "function") nfLive();
  };
  frame(t0);
}

function go(i, keepPlaying = playing) {
  cur = Math.min(log.length - 1, Math.max(0, i));
  clearTimeout(timer);
  const e = log[cur], ms = duration(e);
  playing = keepPlaying && cur < log.length - 1;
  FLIGHT.i = cur; FLIGHT.f = e.kind === "msg" ? 0 : 1;
  showTwin(e); showCore(e); showBottom(e);                 // one entry drives all three areas
  if (typeof nfRefresh === "function") nfRefresh();       // the inspector and the live tracker follow the timeline
  animateDot(e, ms);
  document.getElementById("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
  if (playing) timer = setTimeout(() => go(cur + 1), ms);
}

// ======================================================================= camera
function bounds() {
  const xs = Object.values(T.sites).map(s => s.xy[0]).concat(route.points.map(p => p[0]));
  const ys = Object.values(T.sites).map(s => s.xy[1]).concat(route.points.map(p => p[1]));
  return [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
}
function overviewCamera() {
  const [x0, x1, y0, y1] = bounds(), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, size = Math.max(x1 - x0, y1 - y0);
  camera.position.copy(V(cx - size * 0.05, cy - size * 1.05, size * 1.45)); controls.target.copy(V(cx + size * 0.06, cy, 0));
}
// follow the person from behind: the camera stays behind and above it, looking ahead along the walk
const FOLLOW = { back: 60, up: 30, ahead: 35 };
function followPose(pos, heading) {
  const f = new THREE.Vector3(Math.cos(heading), 0, -Math.sin(heading));      // forward, in three.js axes
  return [pos.clone().addScaledVector(f, -FOLLOW.back).setY(FOLLOW.up), pos.clone().addScaledVector(f, FOLLOW.ahead).setY(5)];
}
function followCamera(k, snap = true) {
  if (!snap) return;                                         // the animation loop keeps the camera behind the person
  const [cam, tgt] = followPose(WALK.pos, WALK.heading);
  camera.position.copy(cam); controls.target.copy(tgt);
}
function setView(v) {
  view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  if (v === "overview") overviewCamera(); else if (log) followCamera(log[cur].step);
  controls.update();
}

// ======================================================================= controls
document.getElementById("play").onclick = () => go(cur >= log.length - 1 ? 0 : cur, !playing);
routeSel.onchange = () => setRoute(+routeSel.value);
{ // the (i) button next to the flow label: the sentence about the current step, as a small popup
  const btn = document.getElementById("noteBtn"), pop = document.getElementById("notePop");
  const open = on => { pop.hidden = !on; btn.setAttribute("aria-expanded", on); btn.setAttribute("aria-pressed", on); };
  btn.onclick = ev => { ev.stopPropagation(); open(pop.hidden); };
  document.addEventListener("click", ev => { if (!pop.contains(ev.target)) open(false); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") open(false); });
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
document.addEventListener("keydown", ev => {
  if (ev.key === " " && ev.target.tagName !== "SELECT") { ev.preventDefault(); document.getElementById("play").click(); }
});

function resize() {                                         // keep the scene centred in the space right of the panel
  const w = stage.clientWidth, h = stage.clientHeight, P = w > 700 && !document.body.classList.contains("cfg") ? 290 : 0;
  renderer.setSize(w, h); camera.aspect = (w + P) / h;
  if (P) camera.setViewOffset(w + P, h, 0, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
new ResizeObserver(resize).observe(stage);                  // the inspector column opening or closing changes the width
// twin.html#route=3&frame=120 opens route 3 at entry 120 (also handy for screenshots)
// #a3=6&ttt=2 opens with that handover rule (offset dB, time-to-trigger steps)
{
  const off0 = location.hash.match(/a3=([\d.]+)/), ttt0 = location.hash.match(/ttt=(\d+)/);
  if (off0) { RULE.off = +off0[1]; document.getElementById("a3off").value = RULE.off; }
  if (ttt0) { RULE.ttt = +ttt0[1]; document.getElementById("a3ttt").value = RULE.ttt; }
}
setRoute(+((location.hash.match(/route=(\d)/) || [0, DATA.default_route])[1])).then(() => {
  const frame0 = location.hash.match(/frame=(\d+)/);
  if (frame0) go(+frame0[1], false);
  const view0 = location.hash.match(/view=(\w+)/);
  if (view0) setView(view0[1]);
  const cam = (decodeURIComponent(location.hash).match(/cam=([^&]+)/) || [, ""])[1].split(",").map(Number);
  if (cam.length === 3 && cam.every(Number.isFinite)) {      // #cam=x,y,d (also applied by the layers script)
    const [x, y, d] = cam; camera.position.copy(V(x - d * 0.15, y - d * 0.75, d * 0.65)); controls.target.copy(V(x, y, 0)); controls.update();
  }
});
const HOLD_FLASH = /flash=1/.test(location.hash);
function animateWalker(now) {
  const dt = Math.min(0.1, (now - WALK.last) / 1000); WALK.last = now;
  // walk towards the step's point (about one step's time, 170 ms at 1x), turn smoothly to the walking direction
  const before = WALK.pos.clone();
  WALK.pos.lerp(WALK.target, 1 - Math.exp(-dt * 14 * speed()));
  const moved = WALK.pos.distanceTo(before);                // metres walked in this frame
  let dh = WALK.targetHeading - WALK.heading; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
  WALK.heading += dh * (1 - Math.exp(-dt * 10));
  WALK.phase += moved * Math.PI / 0.75;                     // one stride (two steps) per 1.5 m
  const walking = moved / Math.max(dt, 1e-3) > 0.3;
  const u = walker.userData, swing = walking ? 0.55 * Math.sin(WALK.phase) : 0;
  const ease = x => x + ((walking ? 1 : 0) * swing - x) * Math.min(1, dt * 12);   // legs come to rest when standing
  u.legL.rotation.z = walking ? swing : ease(u.legL.rotation.z);
  u.legR.rotation.z = walking ? -swing : ease(u.legR.rotation.z);
  u.armL.rotation.z = walking ? -0.7 * swing : ease(u.armL.rotation.z);
  walker.position.copy(WALK.pos).setY(walking ? 0.04 * PERSON_SCALE * Math.abs(Math.cos(WALK.phase)) : 0);
  walker.rotation.y = WALK.heading;
  halo.position.copy(WALK.pos).setY(0.6);
  // the line from the phone to the serving sector; at a handover it flashes (thick and pulsing) for 1.2 s
  walker.updateMatrixWorld(true);
  const phoneAt = u.phone.getWorldPosition(new THREE.Vector3());
  servLine.visible = walker.visible && !!WALK.sector;
  const f = HOLD_FLASH && WALK.sector ? 0.15 : (now - WALK.flashAt) / 1200;   // #flash=1 holds it (screenshots)
  if (WALK.sector) {
    placeLine(servLine, phoneAt, V(...WALK.sector.pos));
    const r = f < 1 ? 1 + 1.2 * (1 - f) : 1;
    servLine.scale.x = servLine.scale.z = r;
    servLine.material.opacity = f < 1 ? 0.55 + 0.45 * Math.abs(Math.cos(f * Math.PI * 4)) : WALK.opacity;
  }
  const ring = f < 1 ? 1 + 2.5 * f : 1;                      // a ring spreads from the person's feet at the handover
  halo.scale.set(ring, ring, ring); halo.material.opacity = f < 1 ? 1 - 0.8 * f : 0.9;
  if (view === "follow" && walker.visible) {
    const [cam, tgt] = followPose(WALK.pos, WALK.heading), k = 1 - Math.exp(-dt * 3);
    camera.position.lerp(cam, k); controls.target.lerp(tgt, k);
  }
}
renderer.setAnimationLoop(now => { animateWalker(now); controls.update(); renderer.render(scene, camera); });

  return `<h3>Real packet from the class capture <span class="small">frame #${f.frame}</span></h3>

<script>
// ======================================================================= the Configure tab
// Choose antenna settings and place UEs; the local server (server/, python -m server) re-runs Sionna RT and returns
// per-UE RSRP / serving sector / SINR / LOS and a coverage map. Unlike the other tabs, nothing here is precomputed.
const CF = {
  defaults: null, sectors: [], ue: null, rays: 1000000, threshold: -110,
  ues: [], nextId: 1, selected: null, gnb: "All", gnbXY: null, posWarn: {},
  applied: null,          // the settings of the last Run (what the coverage map and UE numbers were computed with)
  result: null, coverage: null, busy: false, queued: false, dirty: false, status: "", statusKind: "",

const cfgGroup = new THREE.Group(), cfgUEs = new THREE.Group(), cfgArrows = new THREE.Group();
cfgGroup.add(cfgArrows, cfgUEs); cfgGroup.visible = false; scene.add(cfgGroup);
const covCanvas = document.createElement("canvas"), covTex = new THREE.CanvasTexture(covCanvas);
covTex.magFilter = THREE.NearestFilter;
const covMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: covTex, transparent: true, depthWrite: false }));
covMesh.rotation.x = -Math.PI / 2; covMesh.visible = false; cfgGroup.add(covMesh);

scene.traverse(o => { if (o instanceof THREE.ArrowHelper) defaultArrows.push(o); });

// set by the campus-layers script below (scene switch and layer toggles); defaults when it is absent
const twinScene = () => (typeof LAY === "undefined" ? "v1" : LAY.scene);
const coverageLayerOn = () => typeof LAY === "undefined" || LAY.heat;      // the "Show radio heat map" button
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const raysText = r => (r >= 1e6 ? `${r / 1e6}e6` : `${r / 1e5}e5`) + " rays";

// ---- talking to the server
async function api(path, body) {
  if (SERVER == null) throw new Error("no server on the static site");
  const r = await fetch(SERVER + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error(`${r.status}: ${(await r.text()).slice(0, 300)}`);
  return r.json();
}
async function cfgInit() {
  if (CF.defaults) return;
  try {
    CF.defaults = await api("/defaults");
  } catch (e) {
    // no server (e.g. the GitHub Pages copy): one short message; the tab's controls are not drawn and clicks on the
    // campus do nothing (they need CF.defaults)
    $("cfgPane").innerHTML = `<div class="alert">Configure needs the local server (see README)</div>`;
    return;
  }
  CF.defaults.gnb_xy = CF.defaults.gnb_xy || Object.fromEntries(Object.entries(T.sites).map(([k, v]) => [k, v.xy]));
  CF.sectors = clone(CF.defaults.sectors); CF.ue = clone(CF.defaults.ue); CF.gnbXY = clone(CF.defaults.gnb_xy);
  CF.rays = CF.defaults.rays; CF.threshold = CF.defaults.threshold_dbm;
  cfgDrawPane(); cfgDrawArrows(); cfgDrawDefaults();
  run(true);
}

// one request at a time; a change made while one runs is sent when it finishes
async function run(withCoverage) {
  if (!CF.defaults) return;
  if (withCoverage) {
    CF.applied = { sectors: sectorsForRun(), ue: clone(CF.ue), rays: CF.rays, scene: twinScene() }; CF.dirty = false;
    if ($("cfgDirty")) $("cfgDirty").hidden = true;
  }
  if (!CF.applied) return;
  if (CF.busy) { CF.queued = CF.queued === "cov" || withCoverage ? "cov" : "ue"; return; }
  CF.busy = true;
  const sent = CF.applied;
  setStatus("Running …");
  try {
    const res = await api("/simulate", { ...CF.applied, ues: CF.ues.map(u => ({ id: u.id, x: u.x, y: u.y })),
                                         coverage: withCoverage, threshold_dbm: CF.threshold });
    CF.result = res;
    if (res.coverage) CF.coverage = { ...res.coverage, rays: sent.rays };
    setStatus("", "");
  } catch (e) { setStatus("Server error: " + e.message, "err"); }

  cfgDrawResults();
  const q = CF.queued; CF.queued = false;
  if (q) run(q === "cov");
}
function setStatus(text, kind = "") { CF.status = text; CF.statusKind = kind; const s = $("cfgStatus"); if (s) { s.textContent = text; s.className = "cfgstatus " + kind; } }

// ---- the right pane: sector and UE settings, buttons, the UE table
function opts(list, v) { return list.map(o => `<option ${String(o) === String(v) ? "selected" : ""}>${o}</option>`).join(""); }

  const num = (k, step) => { const v = same(k); return `<input data-g="${k}" type="number" step="${step}" ${v == null ? 'placeholder="mixed"' : `value="${v}"`}>`; };
  const sel = (k, list) => { const v = same(k); return `<select data-g="${k}">${v == null ? '<option value="" selected>mixed</option>' : ""}${opts(list, v)}</select>`; };
  $("cfgPane").innerHTML = `<div class="cfgcols">
    <div><h3>gNB <select id="cfGnb">${["All", "A", "B", "C"].map(g => `<option value="${g}" ${g === CF.gnb ? "selected" : ""}>${g === "All" ? "All gNBs" : "gNB-" + g}</option>`).join("")}</select></h3>
      <div class="cfgform">
        <label>x (m)</label><input data-p="0" type="number" step="1" ${all ? 'disabled placeholder="per gNB"' : `value="${CF.gnbXY[CF.gnb][0]}"`}>
        <label>y (m)</label><input data-p="1" type="number" step="1" ${all ? 'disabled placeholder="per gNB"' : `value="${CF.gnbXY[CF.gnb][1]}"`}>
        <label>Height (m)</label>${num("height_m", 1)}

    const nx = -(y1 - y0) / L * w / 2, ny = (x1 - x0) / L * w / 2, k = pos.length / 3;
    for (const [x, y] of [[x0 + nx, y0 + ny], [x0 - nx, y0 - ny], [x1 - nx, y1 - ny], [x1 + nx, y1 + ny]]) pos.push(x, h, -y);
    idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: colour, side: THREE.DoubleSide }));
}
if (CTX) {
  for (const a of CTX.areas) {
    const [colour, h] = GROUND[a.kind] || ["#cccccc", 0.05];
    const outer = a.pts.outer || a.pts, holes = a.pts.holes || [];
    campus.ground.add(flat(outer, holes, colour, h));
    if (a.kind === "pitch" || a.kind === "football") {       // white outline, like field markings
      const l = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outer.map(([x, y]) => V(x, y, 0.12))),
                                   new THREE.LineBasicMaterial({ color: 0xffffff }));
      campus.ground.add(l);
    }
  }
  if (CTX.river_lines.length) campus.ground.add(ribbons(CTX.river_lines.map(pts => ({ pts, w: 30 })), 0.04, GROUND.water[0]));
  campus.roads.add(ribbons(CTX.roads.filter(r => r.kind === "road"), 0.35, "#e4e0d8"));
  campus.roads.add(ribbons(CTX.roads.filter(r => r.kind === "path"), 0.36, "#f3efe6"));
  if (CTX.track && CTX.track.length) campus.ground.add(ribbons(CTX.track.map(pts => ({ pts, w: 1.2 })), 0.11, GROUND.track[0]));
}

// ---- trees (v2): one crown and one trunk per tree, crown from the vegetation model's base to the tree height
if (SV2 && SV2.trees && SV2.trees.length) {
  const n = SV2.trees.length, base = SV2.vegetation.crown_base_m;
  const crown = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshLambertMaterial({ color: 0x4e8a3a }), n);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.4, 1, 6), new THREE.MeshLambertMaterial({ color: 0x7a5a3a }), n);
  const M = new THREE.Matrix4(), q = new THREE.Quaternion();
  SV2.trees.forEach(([x, y, d, h], i) => {
    const b = Math.min(base, h / 2), c = (h - b) / 2;
    M.compose(V(x, y, b + c), q, new THREE.Vector3(d / 2, c, d / 2)); crown.setMatrixAt(i, M);
    M.compose(V(x, y, b / 2), q, new THREE.Vector3(1, b, 1)); trunk.setMatrixAt(i, M);
  });
  campus.trees.add(crown, trunk);
}

// ---- labels of the main buildings (OpenStreetMap names)
function tag(text) {
  const c = document.createElement("canvas"), x = c.getContext("2d"), font = "600 28px system-ui, -apple-system, sans-serif";
  x.font = font; const w = Math.ceil(x.measureText(text).width) + 20; c.width = w; c.height = 40;
  const y = c.getContext("2d"); y.font = font;
  y.fillStyle = "rgba(255,255,255,0.88)"; y.fillRect(0, 0, w, 40);
  y.fillStyle = "#1d2330"; y.fillText(text, 10, 29);
  // constant size on screen (about 2.6 % of the view's height), so labels stay readable when zooming in or out
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, sizeAttenuation: false }));
  s.scale.set(0.026 * w / 40, 0.026, 1); s.renderOrder = 9; return s;
}
if (CTX) for (const [name, x, y] of CTX.labels) { const s = tag(name); s.position.copy(V(x, y, 32)); campus.labels.add(s); }

// ---- the coverage-map picture of each scene (same extent and colours)
const sceneMapTex = { v1: map.material.map, v2: null };
if (SV2) { sceneMapTex.v2 = new THREE.TextureLoader().load(SV2.rsrp_map.png); sceneMapTex.v2.magFilter = THREE.NearestFilter; }

// ---- controls: layer toggles and the heat-map button (header); the rest behind one "Info" button (3D view)
const bar = document.createElement("span"); bar.className = "group small"; bar.id = "layerBar";
bar.innerHTML = Object.keys(LAY.on).map(k => `<label class="group"><input type="checkbox" data-layer="${k}" checked>${k}</label>`).join("")
  + `<button id="heatBtn" aria-pressed="false">Show radio heat map</button>`;
document.querySelector("header .tabs").after(bar);
const heatBtn = document.getElementById("heatBtn");
const infoBtn = document.createElement("button"); infoBtn.id = "infoBtn"; infoBtn.textContent = "Info"; infoBtn.setAttribute("aria-pressed", "false");
const info = document.createElement("div"); info.className = "overlay small"; info.id = "infoPanel"; info.hidden = true;
document.getElementById("stage").parentElement.append(infoBtn, info);
const scenarioHtml = $("scenario").innerHTML; $("scenario").hidden = true;   // the Scenario box moves into Info
const ba = SV2 ? Object.fromEntries(SV2.before_after.map(r => [r.metric, r])) : {};
const baRow = (k, label) => ba[k] ? `<tr><td>${label}</td><td>${ba[k].v1}</td><td>${ba[k].v2}</td></tr>` : "";
const swatch = c => `<span class="dot" style="background:${c};border:1px solid #0003"></span>`;
function infoHtml() {
  const v = CTX && CTX.v2_summary, veg = SV2 && SV2.vegetation;
  return `<h2>Scenario</h2>${scenarioHtml.replace(/<b>Scenario<\/b><br>/, "")}` +
    (v ? `<h2>Twin v2 (shown)</h2>${v.buildings} buildings: ${v.from_drawings} outlines from the IITGN drawings, the rest
      OpenStreetMap; heights set to G+3 (${v.g3_m} m), kiosks/shops under 100 m² 1 floor (${v.floor_m} m), Lal Minar
      ${v.lal_minar_m} m (estimated). ${SV2.trees.length} trees: vegetation loss ${veg.db_per_m} dB/m, cap ${veg.cap_db} dB,
      <b>to be calibrated</b>.` : "") +
    `<h2>Names</h2>Sectors are numbered by azimuth within each site: ${Object.entries(SECTOR_LABEL).map(([k, v]) => `${v} = ${k}`).join(", ")}
      (the report uses the azimuth names). Strategies: Fixed = B1, Random = B2 in the report.` +
    (tab === "strategies" || tab === "whatif" || (tab === "mobility" && T.walk_scene !== "v2")
      ? `<br><i>This tab's results come from the study's twin (v1).</i>` : "") +
    (T.walk_scene === "v2" ? `<h2>Walking person (Mobility tab)</h2>Three walks along the campus roads and paths
      (OpenStreetMap), ray-traced on twin v2 every 2 m (tasks/task10_walk_v2.py); A3 handover rule 3 dB for 2 steps.
      The person is drawn about ${PERSON_SCALE}× real size (about ${(1.75 * PERSON_SCALE).toFixed(0)} m tall) so it can
      be seen from the overview; the radio uses the phone at 1.5 m. The line from the phone to the serving sector has
      the site's colour and flashes at each handover. Route dots take the serving site's colour; rings mark handovers
      (large ring = between sites, Xn).
      <br><b>Handover rule.</b> The study used A3 offset <b>${STUDY_RULE.off} dB</b>, time-to-trigger <b>${STUDY_RULE.ttt}
      steps</b> (2 m steps at 1.4 m/s, about 2.9 s); the route menu's handover counts use it. The "Handover rule" control
      recomputes the serving sector from each route's saved ray-traced RSRP (no new ray tracing); the server rebuilds the
      message timeline (python -m server). Now: ${RULE.off} dB / ${RULE.ttt} steps.` : "") +
    (SV2 ? `<table><tr><th></th><th>v1 (study)</th><th>v2</th></tr>
      ${baRow("coverage, RSRP > -110 dBm (% of outdoor 5 m cells)", "coverage %")}
      ${baRow("LOS to serving sector (%)", "LOS %")}
      ${baRow("median best-sector RSRP, UEs (dBm)", "median RSRP (dBm)")}
      ${baRow("Twin: mean throughput (Mbps)", "Twin (Mbps)")}</table>` : "") +
    (CTX ? `<h2>Legend</h2>` + Object.values(CTX.zones).map(z => swatch(z.color) + z.label).join("<br>") + "<br>" +
      [["lawn", "lawns"], ["football", "football ground"], ["pitch", "other sports fields"], ["track", "running track (shape approx.)"], ["water", "water"]]
        .map(([k, t]) => swatch(GROUND[k][0]) + t).join("<br>") + `<br>${swatch("#4e8a3a")}trees
      <p>Map data © OpenStreetMap contributors (ODbL).</p>` : "");
}

function applyLayers() {
  const s = LAY.scene, on = LAY.on, cfg = tab === "configure";
  if (baseBuildings) baseBuildings.visible = false;
  campus.v1.visible = on.buildings && s === "v1";
  if (campus.v2) campus.v2.visible = on.buildings && s === "v2";
  campus.trees.visible = on.trees && s === "v2";
  campus.roads.visible = on.roads;
  campus.labels.visible = on.labels;
  if (sceneMapTex[s]) { map.material.map = sceneMapTex[s]; map.material.needsUpdate = true; }
  map.visible = LAY.heat && !cfg;
  if (typeof covMesh !== "undefined") covMesh.visible = LAY.heat && cfg && !!(CF && CF.coverage);
  ground.material.color.set(LAY.heat ? PLAIN : GRASS);
  document.body.classList.toggle("heat", LAY.heat);          // colour bars only with the heat map
  heatBtn.textContent = LAY.heat ? "Hide radio heat map" : "Show radio heat map";
  heatBtn.setAttribute("aria-pressed", LAY.heat);
  info.innerHTML = infoHtml();
}
heatBtn.onclick = () => { LAY.heat = !LAY.heat; applyLayers(); };
infoBtn.onclick = () => { info.hidden = !info.hidden; infoBtn.setAttribute("aria-pressed", !info.hidden); };
document.querySelectorAll("[data-layer]").forEach(i => i.onchange = () => { LAY.on[i.dataset.layer] = i.checked; applyLayers(); });
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", applyLayers));
// twin.html#heat=1&info=1&off=labels,trees&cam=-336,278,120 : heat map on, Info open, layers off, camera aimed at (x, y)
{
  const h = decodeURIComponent(location.hash), get = k => (h.match(new RegExp(k + "=([^&]+)")) || [])[1];
  if (get("heat") === "1") LAY.heat = true;
  if (get("info") === "1") { info.hidden = false; infoBtn.setAttribute("aria-pressed", "true"); }
  (get("off") || "").split(",").filter(k => k in LAY.on).forEach(k => {
    LAY.on[k] = false; const i = document.querySelector(`[data-layer="${k}"]`); if (i) i.checked = false; });
  const cam = (get("cam") || "").split(",").map(Number);
  if (cam.length === 3 && cam.every(Number.isFinite)) {
    const [x, y, d] = cam; camera.position.copy(V(x - d * 0.15, y - d * 0.75, d * 0.65)); controls.target.copy(V(x, y, 0)); controls.update();
  }
}
applyLayers();
</script>
</body>
