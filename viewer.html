<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IITGN 5G Twin</title>
<link rel="icon" href="data:,">
<!--
  Template for twin.html. run.py puts the 3D library (three.js, from vendor/) where LIBRARIES is, and the
  twin data and message logs where DATA is. Everything is precomputed in Python; this page only plays it back.
    left   = the 3D campus twin: buildings, sites and sectors, RSRP map, the walking phone, its serving sector
    right  = the 5G network: elements, interfaces, the current message moving along its interface
    bottom = what is happening now, in one line, and the identities in use
-->
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f9; --panel: #ffffff; --ink: #1d2330; --ink2: #5b6475; --line: #d5dae2; --muted: #eef0f4;
  --A: #2563eb; --B: #d97706; --C: #059669; --hl: #dc2626; --n1: #7c3aed;
  --f1: #64748b; --f2: #2563eb; --f3: #0891b2; --f4: #059669; --f5: #d97706; --f6: #db2777;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; }
h1 { font-size: 17px; margin: 0 10px 0 0; }
button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.group { display: flex; gap: 4px; align-items: center; }
.setucity { margin-left: auto; display: grid; gap: 1px; text-decoration: none; color: #fff; background: var(--A); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.setucity small { font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffffffcc; }
.setucity:hover { filter: brightness(1.1); }
.small { font-size: 12px; color: var(--ink2); }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 0 16px; height: 66vh; min-height: 440px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; position: relative; overflow: hidden; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0; }
#stage { width: 100%; height: 100%; }
#stage canvas { display: block; }
/* narrow windows: one column; this must come after the #stage rule above, or that rule's height: 100% wins and the
   3D view collapses (main has no fixed height in one-column mode) */
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #stage { height: 60vh; } }
.overlay { position: absolute; background: rgba(255, 255, 255, .92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
#twinTitle { top: 10px; left: 10px; }
#signal { top: 44px; left: 10px; width: 275px; }
#signal table { border-collapse: collapse; width: 100%; margin: 4px 0; }
#signal td { padding: 1px 4px; }
#signal td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
#bar { height: 8px; border-radius: 4px; margin: 6px 0 2px; }
#barTicks { display: flex; justify-content: space-between; color: var(--ink2); }
#coreTitle { padding: 10px 12px 0; }
#net { display: block; width: 100%; height: calc(100% - 30px); }
footer { margin: 12px 16px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
#now { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#note { font-size: 16px; font-weight: 600; flex: 1 1 300px; }
.flowwrap { position: relative; display: inline-flex; align-items: center; gap: 6px; }
#noteBtn { width: 20px; height: 20px; padding: 0; border-radius: 50%; font: italic 700 12px Georgia, serif; line-height: 18px; text-align: center; }
#notePop { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 5; width: max-content; max-width: min(460px, 80vw); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 9px; color: #fff; white-space: nowrap; }
#ids { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; margin-top: 8px; }
.id { font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid transparent; }
.id b { display: block; color: var(--ink2); font-weight: 500; font-size: 11px; }
.id span { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
.id.unset span { color: var(--ink2); opacity: .5; }
.id.carried { border-color: var(--hl); background: #fdecec; }
.node rect { fill: var(--panel); stroke: var(--ink2); stroke-width: 1.2; }
.node.active rect { stroke: var(--hl); stroke-width: 2.5; }
.node text { fill: var(--ink); font-size: 13px; font-weight: 600; text-anchor: middle; }
.node text.sub { font-size: 9.5px; font-weight: 400; fill: var(--ink2); }
.link { stroke: var(--line); stroke-width: 2; fill: none; }
.link.serving { stroke-width: 4; }
.link.active { stroke: var(--hl) !important; stroke-width: 3.5; }
.link.n1 { stroke: var(--n1); stroke-dasharray: 5 4; opacity: .45; }
.link.n1.active { opacity: 1; stroke-width: 3; stroke: var(--n1) !important; }
.iflabel { font-size: 10.5px; fill: var(--ink2); text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.iflabel.active { fill: var(--hl); font-weight: 700; }
#dotlabel { font-size: 11.5px; font-weight: 700; fill: var(--hl); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
/* the Scenario box and the Strategies / What-if tabs */
[hidden] { display: none !important; }
.tabs { display: flex; gap: 0; margin-right: 6px; }
.tabs button { border-radius: 0; }
.tabs button:first-child { border-radius: 6px 0 0 6px; }
.tabs button:last-child { border-radius: 0 6px 6px 0; }
#scenario { bottom: 10px; right: 10px; line-height: 1.5; }
#uePanel { top: 54px; left: 10px; width: max-content; max-width: calc(100% - 20px); max-height: calc(100% - 64px); overflow: auto; }
#uePanel table, .pane table { border-collapse: collapse; width: 100%; margin: 4px 0; font-size: 12px; }
#uePanel td, .pane td, .pane th { padding: 1px 6px; text-align: right; white-space: nowrap; }
#uePanel td:first-child, .pane td:first-child, .pane th:first-child { text-align: left; }
.pane th { color: var(--ink2); font-weight: 600; border-bottom: 1px solid var(--line); }
.pane td.on, .pane th.on { background: #e8f0fe; font-weight: 700; }
.pane { padding: 10px 12px; height: 100%; overflow: auto; font-size: 13px; }
.pane h3 { font-size: 13px; margin: 12px 0 4px; }
/* the Configure tab */
/* in this tab the 3D view takes the full width and the settings panel sits below it */
body.cfg main { grid-template-columns: 1fr; }
body.cfg #netSection { display: none; }
#cfgBox { margin: 12px 16px 16px; }
#cfgPane { height: auto; overflow: visible; }
.cfgcols { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 3fr) minmax(0, 3fr); gap: 8px 20px; align-items: start; }
.cfgcols > div > h3:first-child, .cfgres > div > h3:first-child { margin-top: 0; }
.cfgres { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px 20px; align-items: start; margin-top: 8px; }
@media (max-width: 900px) { .cfgcols, .cfgres { grid-template-columns: 1fr; } }
#cfgCov { font-weight: 700; margin: 6px 0; } #cfgCov input { width: 64px; font: inherit; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px; }
#cfgDefaults { position: fixed; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 460px; max-width: calc(100% - 32px);
  max-height: calc(100% - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); }
#cfgDefaults table { border-collapse: collapse; width: 100%; }
#cfgDefaults td { padding: 1px 4px; vertical-align: top; }
#cfgDefaults td.changed { background: #fff3cd; font-weight: 700; }
#cfgDefClose { float: right; padding: 0 8px; }
.cfgform.cfgaz { grid-template-columns: repeat(3, auto minmax(0, 1fr)); }
.cfgform { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px; align-items: center; margin: 6px 0; }
.cfgform input, .cfgform select { font: inherit; width: 100%; min-width: 0; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.cfgrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.cfgrow input[type=number] { width: 72px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
.cfgstatus { font-size: 12px; color: var(--ink2); }
.cfgstatus.warn { color: #b45309; font-weight: 600; }
.cfgstatus.err { color: var(--hl); font-weight: 600; }
#cfgTable tr { cursor: pointer; }
#cfgTable tr.sel td { background: #fdecec; }
.alert { display: inline-block; font-size: 12px; font-weight: 600; color: #1e40af; background: #eef4ff; border: 1px solid #bfd3fb; border-radius: 6px; padding: 4px 10px; }
#uePanel.empty { width: auto; padding: 0; border: 0; background: none; }
.cfggrp { display: grid; grid-template-columns: 82px 1fr; gap: 6px 8px; align-items: center; margin: 4px 0; }
.cfggrp > span { font-size: 12px; color: var(--ink2); font-weight: 600; }
.cfggrp > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cfggrp input[type=number] { width: 64px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
/* the 5G Network Visualiser: element / packet / interface panel */
#nfPanel { position: absolute; top: 34px; right: 8px; bottom: 8px; width: min(400px, calc(100% - 16px)); overflow: auto; z-index: 4;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
#nfPanel .nfx { float: right; padding: 0 8px; }
#nfPanel .nfh { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
#nfPanel h3 { font-size: 12px; margin: 10px 0 4px; }
#nfPanel table { border-collapse: collapse; width: 100%; }
#nfPanel td { padding: 2px 4px; vertical-align: top; border-bottom: 1px solid var(--muted); word-break: break-word; }
#nfPanel a, .pklink { color: var(--A); cursor: pointer; text-decoration: underline dotted; }
#nfPanel .nfmsgs button { padding: 0 6px; font-size: 11px; white-space: nowrap; }
.pk { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
.pk.real { background: #dcfce7; color: #166534; } .pk.sim { background: #eef0f4; color: var(--ink2); }
.stack { display: flex; flex-wrap: wrap; gap: 3px; } .stack span { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
.wstree { font: 11.5px/1.45 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin-top: 4px; }
.wstree details { margin-left: 12px; } .wstree > details { margin-left: 0; } .wstree .leaf { margin-left: 26px; white-space: pre-wrap; word-break: break-all; }
.wstree summary { cursor: pointer; white-space: pre-wrap; word-break: break-all; }
button.primary { background: var(--A); color: #fff; border-color: var(--A); font-weight: 600; }
/* campus layers */
#infoBtn { position: absolute; top: 10px; right: 10px; padding: 3px 12px; font-size: 13px; }
#infoPanel { top: 44px; right: 10px; width: 330px; max-height: calc(100% - 60px); overflow: auto; line-height: 1.5; }
#infoPanel h2 { margin: 8px 0 2px; } #infoPanel h2:first-child { margin-top: 0; }
#infoPanel table { border-collapse: collapse; margin-top: 4px; } #infoPanel td, #infoPanel th { padding: 0 10px 0 0; text-align: left; }
/* the RSRP colour bars appear only while the radio heat map is on */
body:not(.heat) #signal #bar, body:not(.heat) #signal #barTicks, body:not(.heat) .heatbar { display: none; }
#layerBar label { gap: 3px; } #layerBar input { margin: 0; }
#ruleCtl input { width: 48px; } #ruleCtl label { gap: 3px; } #a3count { font-weight: 600; } #a3count.warn { color: #b45309; font-weight: 400; }
</style>
</head>
<body>
<header>
  <h1>IIT Gandhinagar 5G digital twin</h1>
  <span class="tabs"><button data-tab="mobility" aria-pressed="true">Twin &amp; 5G core</button><button data-tab="strategies">Strategies</button><button data-tab="whatif">What-if</button><button data-tab="configure">Configure</button></span>
  <span class="group" id="mobControls">
  <label class="group small">Route <select id="route"></select></label>
  <button id="play">▶ Play</button>
  <label class="group small">Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  <span class="group small" id="ruleCtl" title="Event A3: hand over when another sector is stronger than the serving one by the offset, for the time-to-trigger. The study used 3 dB / 2 steps.">Handover rule
    <label class="group">offset <input type="number" id="a3off" min="0" max="20" step="0.5" value="3"> dB</label>
    <label class="group">time-to-trigger <input type="number" id="a3ttt" min="1" max="20" step="1" value="2"> steps</label>
    <span id="a3count"></span></span>
  </span>
  <span class="group small">Camera <button data-view="overview">Overview</button><button data-view="follow">Follow phone</button></span>
  <a class="setucity" id="setucity" href="https://anujjtiwari.github.io/SetuCity/" target="_blank" rel="noopener">Visit the Setu city &rarr;<small>learn telecoms in a 3D city</small></a>
</header>

<main>
  <section>
    <div id="stage"></div>
    <div class="overlay" id="twinTitle"><h2>Digital twin: IITGN campus (ray-traced)</h2></div>
    <div class="overlay" id="signal"></div>
    <div class="overlay" id="uePanel" hidden></div>
    <div class="overlay small" id="scenario"></div>
  </section>
  <section id="netSection">
    <div id="coreTitle"><h2>5G Network Visualiser</h2></div>
    <svg id="net" viewBox="0 0 680 470" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="pane" id="stratPane" hidden></div>
    <div class="pane" id="whatifPane" hidden></div>
  </section>
</main>
<section id="cfgBox" hidden><div class="pane" id="cfgPane"></div></section>
<div id="cfgDefaults" role="dialog" aria-label="Defaults" hidden></div>

<footer>
  <div id="now"><span class="flowwrap"><span class="badge" id="flow"></span><button id="noteBtn" aria-expanded="false" title="what is happening">i</button>
    <div id="notePop" role="tooltip" hidden></div></span><span id="note"></span><span class="small" id="time"></span></div>
  <div id="ids"></div>
</footer>

<!--LIBRARIES-->
<script>
const DATA = /*DATA*/null;
// The local server (python -m server) for the Configure tab and other handover rules. tools/build_site.py sets
// STATIC_SITE = true for the GitHub Pages copy (docs/index.html): no server there, so the page never calls one.
const STATIC_SITE = false;
const SERVER = STATIC_SITE ? null : location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8765";
const T = DATA.twin, SECTORS = T.sectors, NAMES = SECTORS.map(s => s.name);
// Display names only: sectors are numbered by azimuth within each site (A60 -> A1 ...); the data and the server keep
// the original IDs. The baseline strategies B1/B2 are shown as Fixed/Random (so they do not clash with sectors B1/B2).
const SECTOR_LABEL = { A60: "A1", A180: "A2", A300: "A3", B105: "B1", B225: "B2", B345: "B3", C53: "C1", C173: "C2", C293: "C3" };
const sn = n => SECTOR_LABEL[n] || n;
const snText = t => String(t ?? "").replace(/\b(A60|A180|A300|B105|B225|B345|C53|C173|C293)\b/g, m => SECTOR_LABEL[m]);
const STRATEGY_LABEL = { B1: "Fixed", B2: "Random" };
const stn = n => STRATEGY_LABEL[n] || n;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const siteColor = site => css(`--${site}`);
const pretty = s => s.replace(/([a-z])([A-Z])/g, "$1 $2");
const msgName = e => e.message.replace("GTP_U", "GTP-U") + (e.nas ? ` [NAS: ${pretty(e.nas)}]` : "");

// ======================================================================= LEFT: the 3D twin (three.js)
const V = (x, y, z) => new THREE.Vector3(x, z, -y);          // twin: x east, y north, z up -> three.js: y up
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f6);
scene.fog = new THREE.Fog(0xeef2f6, 1800, 4200);
const camera = new THREE.PerspectiveCamera(42, 1, 1, 8000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c0c8, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-600, 1200, 800); scene.add(sun);

// ground and the RSRP map (a picture of the ray-traced best-sector RSRP, laid on the ground)
const [mx0, mx1, my0, my1] = T.rsrp_map.extent;
const ground = new THREE.Mesh(new THREE.PlaneGeometry((mx1 - mx0) * 1.5, (my1 - my0) * 1.5), new THREE.MeshLambertMaterial({ color: 0xe3e7ec }));
ground.rotation.x = -Math.PI / 2; ground.position.copy(V((mx0 + mx1) / 2, (my0 + my1) / 2, -0.1)); scene.add(ground);
const mapTex = new THREE.TextureLoader().load(T.rsrp_map.png);
mapTex.magFilter = THREE.NearestFilter;
const map = new THREE.Mesh(new THREE.PlaneGeometry(mx1 - mx0, my1 - my0), new THREE.MeshBasicMaterial({ map: mapTex, transparent: true, depthWrite: false }));
map.rotation.x = -Math.PI / 2; map.position.copy(V((mx0 + mx1) / 2, (my0 + my1) / 2, 0.2)); scene.add(map);

// buildings: one mesh from the scene's corner points and triangles
const decode = (s, Type) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Type(u.buffer); };
{
  const p = decode(T.buildings.points, Float32Array), q = new Float32Array(p.length);
  for (let i = 0; i < p.length; i += 3) { q[i] = p[i]; q[i + 1] = p[i + 2]; q[i + 2] = -p[i + 1]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(q, 3));
  g.setIndex(new THREE.BufferAttribute(decode(T.buildings.triangles, Uint32Array), 1));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xbdb7ae, roughness: 0.9, flatShading: true, side: THREE.DoubleSide })));
}

// text labels that always face the camera
function label(text, color, size) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const x = c.getContext("2d"); x.font = "700 36px system-ui, sans-serif"; x.textAlign = "center";
  x.lineWidth = 8; x.strokeStyle = "rgba(255,255,255,0.95)"; x.strokeText(text, 128, 46); x.fillStyle = color; x.fillText(text, 128, 46);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(size * 4, size, 1); s.renderOrder = 10; return s;
}

// sites (mast + head + label) and sectors (an arrow in the direction the antenna points + its name)
for (const [site, s] of Object.entries(T.sites)) {
  const [x, y] = s.xy, h = s.height_m;
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2, h, 10), new THREE.MeshStandardMaterial({ color: 0x8a939e }));
  mast.position.copy(V(x, y, h / 2)); scene.add(mast);
  const head = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 12), new THREE.MeshBasicMaterial({ color: siteColor(site) }));
  head.position.copy(V(x, y, h)); scene.add(head);
  const l = label(`Site ${site} · gNB-${site}`, siteColor(site), 46); l.position.copy(V(x, y, h + 70)); scene.add(l);
}
for (const s of SECTORS) {
  const a = s.az * Math.PI / 180, t = s.tilt * Math.PI / 180;
  const dir = V(Math.cos(a) * Math.cos(t), Math.sin(a) * Math.cos(t), -Math.sin(t)).normalize();
  scene.add(new THREE.ArrowHelper(dir, V(...s.pos), 60, new THREE.Color(siteColor(s.site)).getHex(), 14, 9));
  const l = label(sn(s.name), siteColor(s.site), 26); l.position.copy(V(...s.pos).add(dir.clone().multiplyScalar(80))); scene.add(l);
}

// the walking person with the phone, its route (dots on the road), and the line from the phone to its serving sector.
// The person is drawn PERSON_SCALE x real size (a 1.75 m person -> 7 m) so it can be seen from the overview;
// the radio always uses the phone at 1.5 m (twin/scene.py UE_HEIGHT_M).
const PERSON_SCALE = 4;
function makePerson() {
  const g = new THREE.Group(), mat = c => new THREE.MeshLambertMaterial({ color: c });
  const skin = mat(0xc68a5a), shirt = mat(0xdc2626), trousers = mat(0x1f3a5f), shoes = mat(0x1d2330);
  const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  // metres of a 1.75 m person; local +x = forward, +y = up, z = sideways
  const torso = box(0.24, 0.58, 0.40, shirt); torso.position.y = 1.18;
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), skin); head.position.y = 1.62;
  const hair = new THREE.Mesh(new THREE.IcosahedronGeometry(0.135, 1), mat(0x2b2118));
  hair.scale.set(1, 0.6, 1); hair.position.set(-0.02, 1.68, 0);
  const limb = (y, z, len, w, m, foot) => {                  // a pivot (hip or shoulder) with the limb hanging below
    const p = new THREE.Group(); p.position.set(0, y, z);

// The serving sector along the route is recomputed here from the route's saved, ray-traced RSRP (the same rule as

// simulation). Offline (no server) the route colours and counts follow the new rule, the messages stay 3 dB / 2 steps.
const STUDY_RULE = { off: 3, ttt: 2 };

function a3(rsrp, off, ttt) {

  let serving = arg(rsrp[0]), cand = null, count = 0;

    if (best !== serving && rsrp[k][best] > rsrp[k][serving] + off) { count = best === cand ? count + 1 : 1; cand = best; }
    else { count = 0; cand = null; }
    if (count >= ttt) { handovers.push({ step: k, from: NAMES[serving], to: NAMES[best] }); serving = best; cand = null; count = 0; }
    path.push(serving);

    const r = await fetch(SERVER + "/timeline", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ route: +id, offset_db: RULE.off, ttt_steps: RULE.ttt }) });

  const dt = Math.min(0.1, (now - WALK.last) / 1000); WALK.last = now;
  // walk towards the step's point (about one step's time, 170 ms at 1x), turn smoothly to the walking direction
  const before = WALK.pos.clone();
  WALK.pos.lerp(WALK.target, 1 - Math.exp(-dt * 14 * speed()));
  const moved = WALK.pos.distanceTo(before);                // metres walked in this frame
  let dh = WALK.targetHeading - WALK.heading; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
  WALK.heading += dh * (1 - Math.exp(-dt * 10));
  WALK.phase += moved * Math.PI / 0.75;                     // one stride (two steps) per 1.5 m
  const walking = moved / Math.max(dt, 1e-3) > 0.3;
  const u = walker.userData, swing = walking ? 0.55 * Math.sin(WALK.phase) : 0;
  const ease = x => x + ((walking ? 1 : 0) * swing - x) * Math.min(1, dt * 12);   // legs come to rest when standing
  u.legL.rotation.z = walking ? swing : ease(u.legL.rotation.z);
  u.legR.rotation.z = walking ? -swing : ease(u.legR.rotation.z);
  u.armL.rotation.z = walking ? -0.7 * swing : ease(u.armL.rotation.z);
  walker.position.copy(WALK.pos).setY(walking ? 0.04 * PERSON_SCALE * Math.abs(Math.cos(WALK.phase)) : 0);
  walker.rotation.y = WALK.heading;
  halo.position.copy(WALK.pos).setY(0.6);
  // the line from the phone to the serving sector; at a handover it flashes (thick and pulsing) for 1.2 s
  walker.updateMatrixWorld(true);
  const phoneAt = u.phone.getWorldPosition(new THREE.Vector3());
  servLine.visible = walker.visible && !!WALK.sector;
  const f = HOLD_FLASH && WALK.sector ? 0.15 : (now - WALK.flashAt) / 1200;   // #flash=1 holds it (screenshots)
  if (WALK.sector) {
    placeLine(servLine, phoneAt, V(...WALK.sector.pos));
    const r = f < 1 ? 1 + 1.2 * (1 - f) : 1;
    servLine.scale.x = servLine.scale.z = r;
    servLine.material.opacity = f < 1 ? 0.55 + 0.45 * Math.abs(Math.cos(f * Math.PI * 4)) : WALK.opacity;
  }
  const ring = f < 1 ? 1 + 2.5 * f : 1;                      // a ring spreads from the person's feet at the handover
  halo.scale.set(ring, ring, ring); halo.material.opacity = f < 1 ? 1 - 0.8 * f : 0.9;
  if (view === "follow" && walker.visible) {
    const [cam, tgt] = followPose(WALK.pos, WALK.heading), k = 1 - Math.exp(-dt * 3);
    camera.position.lerp(cam, k); controls.target.lerp(tgt, k);
  }
}
renderer.setAnimationLoop(now => { animateWalker(now); controls.update(); renderer.render(scene, camera); });
</script>
<script>

// twin.html#tab=strategies&strategy=B1&ue=5 or #tab=whatif&case=site%20B%20off opens that view
{

<script>
// ======================================================================= the 5G Network Visualiser: click to look inside
// Click a network element (its role, its state at this point of the timeline, the messages it sent or received in
// this flow), a message (the moving dot, the bottom line or a list row: a Wireshark-style packet view) or an
// interface label (its protocol stack and the messages that use it). Every message is simulated by the twin; where
// the class capture (data/pcap_examples.json, tools/extract_pcap.py) has the same message type, the decoded real
// frame is shown too, with identifiers masked.
const PCAP = DATA.pcap || { index: {}, frames: [], captures: [] };
const hx = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nrm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const ROLE = {
  UE: "The phone: finds a cell, connects over the radio (Uu), registers, and sends and receives the user's data.",
  gNB: "Base station: 3 radio sectors; runs RRC with the phone, passes NAS to the AMF (N2) and tunnels data to the UPF (N3).",
  AMF: "Access and mobility: registers the phone, authenticates it with the AUSF, gives it a 5G-GUTI, tracks and pages it.",
  AUSF: "Authentication server: runs 5G-AKA for the AMF (challenge RAND/AUTN, checks RES*).",
  UDM: "Subscriber database: the phone's keys and profile; makes the authentication vector.",
  SIDF: "Inside the UDM: decrypts the SUCI back into the SUPI.",
  NSSF: "Slice selection: tells the AMF which network slice (S-NSSAI) the phone may use.",
  SMF: "Session management: creates the PDU session, gives the phone its IP address and programs the UPF over N4.",
  UPF: "User plane: GTP-U tunnels to the gNBs (N3), NAT to the internet (N6), buffers data for an idle phone.",
  Internet: "The data network beyond N6: here, the server the phone talks to.",
};
const IDS_OF = {
  UE: ["c_rnti", "guti", "s_tmsi", "ue_ip", "pdu_session_id", "qfi"], gNB: ["c_rnti", "ran_ue_ngap_id", "amf_ue_ngap_id", "ul_teid", "dl_teid"],
  AMF: ["supi", "guti", "s_tmsi", "amf_ue_ngap_id", "ran_ue_ngap_id", "s_nssai"], AUSF: ["suci", "supi"], UDM: ["suci", "supi"], SIDF: ["suci", "supi"],
  NSSF: ["s_nssai"], SMF: ["supi", "pdu_session_id", "ue_ip", "qfi", "five_qi", "s_nssai", "ul_teid", "dl_teid"],
  UPF: ["ue_ip", "ul_teid", "dl_teid", "qfi"], Internet: [],
};
const STACK = {
  Uu: { rrc: ["PHY", "MAC", "RLC", "PDCP", "RRC"], data: ["PHY", "MAC", "RLC", "PDCP", "SDAP", "IP (user data)"], bcch: ["PHY", "MAC (BCH / DL-SCH)", "RRC (broadcast)"],
        sync: ["PHY (PSS + SSS + PBCH)"], ra: ["PHY (PRACH / PDSCH)", "MAC"] },
  N1: ["NAS-5GS (inside RRC on Uu, inside NGAP on N2)"], N2: ["IP", "SCTP", "NGAP"], N3: ["IP", "UDP", "GTP-U", "IP (user data)"],
  N4: ["IP", "UDP", "PFCP"], N6: ["IP (user data)"], N11: ["IP", "TCP", "HTTP/2", "JSON"], SBI: ["IP", "TCP", "HTTP/2", "JSON"],
  Xn: ["IP", "SCTP", "XnAP"], internal: ["function call inside the UDM"],
};
const IFACE_INFO = {
  Uu: "Radio link between the phone and a gNB.", N1: "NAS signalling between the phone and the AMF; it rides inside RRC (Uu) and NGAP (N2).",
  N2: "Signalling between a gNB and the AMF (NGAP over SCTP).", N3: "User data between a gNB and the UPF, in GTP-U tunnels (one TEID per direction).",
  N4: "The SMF programs the UPF (PFCP rules: forward, buffer, NAT).", N6: "The UPF's link to the internet (plain IP, after NAT).",
  N11: "AMF ↔ SMF, service-based (HTTP/2 + JSON).", SBI: "Service-based interface between core functions (HTTP/2 + JSON).",
  Xn: "Between two gNBs: handover preparation and context release (XnAP over SCTP).",
};
const CAPTURE_ONLY = { N2: ["NGAP:NGSetupRequest", "NGAP:NGSetupResponse", "NGAP:UERadioCapabilityInfoIndication"],
  Uu: ["RRC:securityModeCommand", "RRC:securityModeComplete", "RRC:ueCapabilityEnquiry", "RRC:ueCapabilityInformation"] };

function stackOf(e) {
  if (e.interface !== "Uu") return [...(STACK[e.interface] || ["?"]), ...(e.nas ? ["NAS-5GS"] : [])];
  const m = e.message;
  const s = m === "SSB" ? STACK.Uu.sync : /^(MIB|SIB1)$/.test(m) ? STACK.Uu.bcch : /^RandomAccess/.test(m) ? STACK.Uu.ra
    : /^(PUSCH|PDSCH)$/.test(m) ? STACK.Uu.data : m === "Paging" ? ["PHY", "MAC (PCH)", "RRC (paging)"] : STACK.Uu.rrc;
  return [...s, ...(e.nas ? ["NAS-5GS"] : [])];
}

// ---- which real frame matches a simulated message
function capKeyFor(e) {
  if (e.message === "GTP_U") return `GTP:G-PDU ${e.src.startsWith("gNB") ? "uplink" : "downlink"}`;
  const want = nrm(e.message);
  return Object.keys(PCAP.index).find(k => /^(NGAP|RRC):/.test(k) && nrm(k.split(":")[1]) === want) || null;
}
function capNasKey(nas) { return nas ? Object.keys(PCAP.index).find(k => k.startsWith("NAS:") && nrm(k.slice(4)) === nrm(nas)) || null : null; }
function realFor(e) {                                       // {frame, key, nasMatch} or null
  const k = capKeyFor(e);
  if (!k) return null;
  const ids = PCAP.index[k], nas = e.nas ? nrm(e.nas) : null;
  const best = ids.find(i => !nas || PCAP.frames[i].types.some(([p, t]) => p === "NAS" && nrm(t) === nas)) ?? ids[0];
  const f = PCAP.frames[best];
  return { f, key: k, nasMatch: !nas || f.types.some(([p, t]) => p === "NAS" && nrm(t) === nas) };
}
const chip = real => real ? `<span class="pk real">real capture</span>` : `<span class="pk sim">simulated (not in capture)</span>`;

// ---- the panel
const nfPanel = document.createElement("div"); nfPanel.id = "nfPanel"; nfPanel.hidden = true;
$("netSection").append(nfPanel);
let nfMode = null;                                          // ["element", name] | ["packet", index] | ["iface", name] | ["capture", key]
function nfOpen(mode) { nfMode = mode; nfPanel.hidden = false; nfDraw(); }
function nfClose() { nfMode = null; nfPanel.hidden = true; }
function nfRefresh() { if (nfMode && nfMode[0] === "element") nfDraw(); }
function nfDraw() {
  const [kind, arg] = nfMode;
  nfPanel.innerHTML = `<button class="nfx" title="close">×</button>` +
    (kind === "element" ? elementHtml(arg) : kind === "packet" ? packetHtml(log[arg], arg) : kind === "iface" ? ifaceHtml(arg) : captureHtml(arg));
  nfPanel.querySelector(".nfx").onclick = nfClose;
  nfPanel.querySelectorAll("[data-pkt]").forEach(b => b.onclick = () => nfOpen(["packet", +b.dataset.pkt]));
  nfPanel.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { go(+b.dataset.jump, false); nfOpen(["packet", +b.dataset.jump]); });
  nfPanel.querySelectorAll("[data-el]").forEach(b => b.onclick = () => nfOpen(["element", b.dataset.el]));
  nfPanel.querySelectorAll("[data-if]").forEach(b => b.onclick = () => nfOpen(["iface", b.dataset.if]));
  nfPanel.querySelectorAll("[data-cap]").forEach(b => b.onclick = () => nfOpen(["capture", b.dataset.cap]));
}

// where the current flow began: flows can interleave briefly (the PDU session request goes out before the AMF has
// the Registration Complete), so up to 3 messages of another flow do not end it
function flowStart(i) {
  let s = i, other = 0;
  for (let j = i - 1; j >= 0 && other <= 3; j--) {

}
function elementHtml(name) {

  const idRow = k => ids[k] === undefined ? "" : `<tr><td>${hx(DATA.identities[k])}</td><td>${hx(ids[k])}</td></tr>`;
  const seen = m => log.slice(0, cur + 1).some(x => x.kind === "msg" && (x.message === m || x.nas === m));
  const lines = [];
  if (name === "UE") lines.push(["radio state", e.ue_state], ["serving sector", e.serving ? `${sn(e.serving)} on gNB-${e.serving[0]}` : "none"]);
  if (isG) {
    const serving = e.serving && e.serving[0] === site;
    lines.push(["sectors", SECTORS.filter(s => s.site === site).map(s => `${sn(s.name)} (${s.az}°)`).join(", ")],
               ["UE context", serving && e.ue_state === "RRC connected" ? "yes: this gNB serves the phone" : serving ? "camped here, no connection" : "no"]);
  }
  if (name === "AMF") lines.push(["registration", seen("RegistrationComplete") ? "registered (RM-REGISTERED)" : seen("RegistrationRequest") ? "in progress" : "not registered"],
                                 ["connection", ids.amf_ue_ngap_id !== undefined ? "CM-CONNECTED" : seen("RegistrationAccept") ? "CM-IDLE" : "–"],
                                 ["tracking area list", seen("RegistrationAccept") ? "001-01-1" : "–"]);
  if (name === "AUSF") lines.push(["5G-AKA", seen("Nausf_UEAuthentication_Authenticate_Response") ? (seen("AuthenticationResponse") ? "done: RES* matched" : "challenge sent, waiting for RES*") : "not started"]);
  if (name === "UDM" || name === "SIDF") lines.push(["SUCI → SUPI", seen("DeconcealSUCI_Response") ? "done" : "not yet"]);
  if (name === "NSSF") lines.push(["allowed slice", seen("Nnssf_NSSelection_Get_Response") ? "SST 1 (eMBB)" : "not asked yet"]);
  if (name === "SMF") lines.push(["PDU session", ids.pdu_session_id === undefined ? "none" : ids.dl_teid !== undefined ? "active (downlink tunnel set)" : "user plane paused / being set up"]);
  if (name === "UPF") {
    let buffered = 0;
    for (const x of log.slice(flowStart(cur), cur + 1)) if (x.kind === "msg" && x.flow === 6 && e.flow === 6) {
      if (x.message === "IPPacket" && x.dst === "UPF") buffered++;
      if (x.message === "GTP_U" && x.src === "UPF") buffered = Math.max(0, buffered - 1);
    }
    lines.push(["tunnels (TEIDs)", `uplink ${ids.ul_teid ?? "–"} (UPF end) · downlink ${ids.dl_teid ?? "– (none: buffering)"} (gNB end)`],
               ["buffered packets", ids.dl_teid === undefined && buffered ? `${buffered} (waiting for the phone)` : "0"],
               ["NAT", ids.ue_ip ? `${ids.ue_ip}:port ↔ 198.51.100.7:port` : "–"]);
  }
  const s0 = flowStart(cur), msgs = [];
  for (let i = s0; i <= cur; i++) { const x = log[i]; if (x.kind === "msg" && x.flow === e.flow && (x.src === name || x.dst === name)) msgs.push(i); }
  const idKeys = IDS_OF[isG ? "gNB" : name] || [];
  return `<div class="nfh">${hx(POS[name][2])} <span class="small">${hx(POS[name][3])}</span></div>
    <div class="small">${ROLE[isG ? "gNB" : name]}</div>
    <h3>State now <span class="small">(${log[cur].kind === "msg" ? hx(msgName(log[cur])) : "step " + log[cur].step}, flow ${e.flow})</span></h3>
    <table>${lines.map(([k, v]) => `<tr><td>${hx(k)}</td><td>${hx(v)}</td></tr>`).join("")}${(isG && !(e.serving && e.serving[0] === site)) ? "" : idKeys.map(idRow).join("")}</table>
    <h3>Messages in this flow so far (${msgs.length})</h3>
    ${msgs.length ? `<table class="nfmsgs">${msgs.map(i => { const x = log[i], out = x.src === name;
      return `<tr><td>${out ? "→" : "←"}</td><td><a data-pkt="${i}">${hx(msgName(x))}</a><div class="small">${out ? "to" : "from"} ${hx(out ? x.dst : x.src)} · ${hx(x.interface)}</div></td>
        <td>${chip(!!realFor(x))}</td><td><button data-jump="${i}" title="move the animation here">jump to</button></td></tr>`; }).join("")}</table>`
      : `<div class="small">None yet in flow ${e.flow}.</div>`}`;
}

function fieldsHtml(e) {
  const f = e.fields || Object.fromEntries((e.carries || []).map(k => [k, e.ids[k]]));
  const rows = Object.entries(f).map(([k, v]) => `<tr><td>${hx(DATA.identities[k] || k.replace(/_/g, " "))}</td><td>${hx(snText(Array.isArray(v) ? v.join(", ") : v))}</td></tr>`);
  return rows.length ? `<table>${rows.join("")}</table>` : `<div class="small">No fields.</div>`;
}
function treeHtml(nodes, depth = 0, openTo = 1) {                 // open down to depth openTo
  return nodes.map(([label, kids]) => kids.length
    ? `<details ${depth < openTo ? "open" : ""}><summary>${hx(label)}</summary>${treeHtml(kids, depth + 1, openTo)}</details>`
    : `<div class="leaf">${hx(label)}</div>`).join("");
}
function realHtml(f, note) {
  const main = f.tree.findIndex(([t]) => /^(NGAP|F1AP|GTP-U)/.test(t));
  return `<h3>Real packet from class capture (frame #${f.frame})</h3>
    <div class="small">${hx(f.capture)} · ${f.length} bytes · ${hx(f.protocols)}${note ? "<br>" + note : ""}<br>Identifiers and IP addresses masked.</div>
    <div class="wstree">${f.tree.map(([t, kids], i) => `<details ${i === main ? "open" : ""}><summary><b>${hx(t)}</b></summary>${treeHtml(kids, 1, i === main ? 12 : 1)}</details>`).join("")}</div>`;
}
function packetHtml(e, i) {
  if (!e || e.kind !== "msg") return `<div class="small">This step is not a message.</div>`;
  const r = realFor(e), onF1 = r && /^RRC:|^F1AP:/.test(r.key);
  const realNas = r && r.f.types.filter(([p]) => p === "NAS").map(([, t]) => t);
  const note = !r ? "" : [onF1 ? "Captured on F1 (between the gNB's DU and CU), inside F1AP; on the air (Uu) the same RRC message is carried by PDCP/RLC/MAC." : "",
    e.nas && !r.nasMatch ? `Same ${hx(r.key.split(":")[0])} message type; in the capture it carries ${hx(realNas.join(", ") || "no NAS")}, not ${hx(pretty(e.nas))}.` : ""].filter(Boolean).join(" ");
  const nasReal = e.nas && capNasKey(e.nas);
  return `<div class="nfh">${hx(msgName(e))}</div>
    <div class="small">${hx(e.src)} → ${hx(e.dst)} · <a data-if="${hx(e.interface === "internal" ? "SBI" : e.interface)}">${hx(e.interface)}</a> · flow ${e.flow} · t = ${(e.t / 1000).toFixed(3)} s</div>
    <div style="margin:6px 0">${chip(!!r)}${r ? ` <span class="small">frame #${r.f.frame}</span>` : ""}${e.nas ? ` · NAS ${hx(pretty(e.nas))}: ${chip(!!nasReal)}` : ""}</div>
    <h3>Protocol stack</h3><div class="stack">${stackOf(e).map(p => `<span>${hx(p)}</span>`).join("")}</div>
    <h3>Fields (simulated by the twin)</h3>${fieldsHtml(e)}
    <div class="small">${hx(snText(e.note))}</div>
    ${r ? realHtml(r.f, note) : `<h3>Real packet</h3><div class="small">No ${hx(e.message.replace("GTP_U", "GTP-U"))} in the class capture (it has NGAP/NAS on N2, F1AP/RRC on F1 and GTP-U on N3; no PFCP, SBI, Xn or radio-only messages): simulated only.</div>`}
    ${i === cur ? "" : `<p><button data-jump="${i}">jump to this message</button></p>`}`;
}
function captureHtml(k) {
  const f = PCAP.frames[PCAP.index[k][0]];
  return `<div class="nfh">${hx(k.split(":")[1])} <span class="small">${hx(k.split(":")[0])}</span></div>
    <div>${chip(true)} <span class="small">in the class capture, not in the twin's flows</span></div>${realHtml(f, "")}`;
}
function ifaceHtml(name) {
  const all = new Map();
  for (const l of Object.values(DATA.logs)) for (const x of l)
    if (x.kind === "msg" && (x.interface === name || (name === "N1" && x.nas))) {
      const m = name === "N1" ? x.nas : x.message;
      if (!all.has(m)) all.set(m, name === "N1" ? !!capNasKey(x.nas) : !!realFor(x));
    }
  const stack = name === "Uu" ? [["RRC signalling", STACK.Uu.rrc], ["user data", STACK.Uu.data], ["broadcast", STACK.Uu.bcch]] : [["", STACK[name] || []]];
  const extra = (CAPTURE_ONLY[name] || []).filter(k => PCAP.index[k]);
  return `<div class="nfh">${hx(name)}</div><div class="small">${hx(IFACE_INFO[name] || "")}</div>
    <h3>Protocol stack</h3>${stack.map(([t, s]) => `${t ? `<div class="small">${t}</div>` : ""}<div class="stack">${s.map(p => `<span>${hx(p)}</span>`).join("")}</div>`).join("")}
    <h3>Messages on ${hx(name)} in the twin (${all.size})</h3>
    <table>${[...all].map(([m, real]) => `<tr><td>${hx(name === "N1" ? pretty(m) : m.replace("GTP_U", "GTP-U"))}</td><td>${chip(real)}</td></tr>`).join("")}</table>
    ${extra.length ? `<h3>Also in the class capture</h3>${extra.map(k => `<div><a data-cap="${k}">${hx(k.split(":")[1])}</a></div>`).join("")}` : ""}`;
}

// ---- make the diagram clickable
for (const [name, g] of Object.entries(nodeEl)) { g.style.cursor = "pointer"; g.addEventListener("click", () => nfOpen(["element", name])); }
for (const [k, t] of Object.entries(labelEl)) {
  const iface = k === "N1" ? "N1" : t.textContent;
  t.style.cursor = "pointer"; t.style.pointerEvents = "all"; t.addEventListener("click", () => nfOpen(["iface", iface]));
}
for (const d of [dot, dotLabel]) { d.style.cursor = "pointer"; d.addEventListener("click", () => nfOpen(["packet", cur])); }
$("note").classList.add("pklink"); $("note").title = "open this message";
$("note").addEventListener("click", () => { if (log[cur].kind === "msg") nfOpen(["packet", cur]); });
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { if (b.dataset.tab !== "mobility") nfClose(); }));
document.addEventListener("keydown", ev => { if (ev.key === "Escape") nfClose(); });
// twin.html#route=1&frame=40&nf=AMF opens an element; &pkt=1 opens the current message; &if=N2 an interface
{
  const h = decodeURIComponent(location.hash), get = k => (h.match(new RegExp("[#&]" + k + "=([^&]+)")) || [])[1];
  setTimeout(() => { if (get("nf")) nfOpen(["element", get("nf")]); if (get("pkt")) nfOpen(["packet", cur]); if (get("if")) nfOpen(["iface", get("if")]); }, 0);
}

<script>
// ======================================================================= the Configure tab
// Choose antenna settings and place UEs; the local server (server/, python -m server) re-runs Sionna RT and returns
// per-UE RSRP / serving sector / SINR / LOS and a coverage map. Unlike the other tabs, nothing here is precomputed.
const CF = {
  defaults: null, sectors: [], ue: null, rays: 1000000, threshold: -110,
  ues: [], nextId: 1, selected: null, gnb: "All", gnbXY: null, posWarn: {},
  applied: null,          // the settings of the last Run (what the coverage map and UE numbers were computed with)
  result: null, coverage: null, busy: false, queued: false, dirty: false, status: "", statusKind: "",
};
const cfgGroup = new THREE.Group(), cfgUEs = new THREE.Group(), cfgArrows = new THREE.Group();
cfgGroup.add(cfgArrows, cfgUEs); cfgGroup.visible = false; scene.add(cfgGroup);
const covCanvas = document.createElement("canvas"), covTex = new THREE.CanvasTexture(covCanvas);
covTex.magFilter = THREE.NearestFilter;
const covMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: covTex, transparent: true, depthWrite: false }));
covMesh.rotation.x = -Math.PI / 2; covMesh.visible = false; cfgGroup.add(covMesh);
const defaultArrows = [];                                  // the precomputed sector arrows: hidden while configuring
scene.traverse(o => { if (o instanceof THREE.ArrowHelper) defaultArrows.push(o); });
const clone = o => JSON.parse(JSON.stringify(o));
// set by the campus-layers script below (scene switch and layer toggles); defaults when it is absent
const twinScene = () => (typeof LAY === "undefined" ? "v1" : LAY.scene);
const coverageLayerOn = () => typeof LAY === "undefined" || LAY.heat;      // the "Show radio heat map" button
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const raysText = r => (r >= 1e6 ? `${r / 1e6}e6` : `${r / 1e5}e5`) + " rays";

// ---- talking to the server
async function api(path, body) {
  if (SERVER == null) throw new Error("no server on the static site");
  const r = await fetch(SERVER + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error(`${r.status}: ${(await r.text()).slice(0, 300)}`);
  return r.json();
}
async function cfgInit() {
  if (CF.defaults) return;
  try {
    CF.defaults = await api("/defaults");
  } catch (e) {
    // no server (e.g. the GitHub Pages copy): one short message; the tab's controls are not drawn and clicks on the
    // campus do nothing (they need CF.defaults)
    $("cfgPane").innerHTML = `<div class="alert">Configure needs the local server (see README)</div>`;
    return;
  }
  CF.defaults.gnb_xy = CF.defaults.gnb_xy || Object.fromEntries(Object.entries(T.sites).map(([k, v]) => [k, v.xy]));
  CF.sectors = clone(CF.defaults.sectors); CF.ue = clone(CF.defaults.ue); CF.gnbXY = clone(CF.defaults.gnb_xy);
  CF.rays = CF.defaults.rays; CF.threshold = CF.defaults.threshold_dbm;
  cfgDrawPane(); cfgDrawArrows(); cfgDrawDefaults();
  run(true);
}

// one request at a time; a change made while one runs is sent when it finishes
async function run(withCoverage) {
  if (!CF.defaults) return;
  if (withCoverage) {
    CF.applied = { sectors: sectorsForRun(), ue: clone(CF.ue), rays: CF.rays, scene: twinScene() }; CF.dirty = false;
    if ($("cfgDirty")) $("cfgDirty").hidden = true;
  }
  if (!CF.applied) return;
  if (CF.busy) { CF.queued = CF.queued === "cov" || withCoverage ? "cov" : "ue"; return; }
  CF.busy = true;
  const sent = CF.applied;
  setStatus("Running …");
  try {
    const res = await api("/simulate", { ...CF.applied, ues: CF.ues.map(u => ({ id: u.id, x: u.x, y: u.y })),
                                         coverage: withCoverage, threshold_dbm: CF.threshold });
    CF.result = res;
    if (res.coverage) CF.coverage = { ...res.coverage, rays: sent.rays };
    setStatus("", "");
  } catch (e) { setStatus("Server error: " + e.message, "err"); }
  CF.busy = false;
  cfgDrawResults();
  const q = CF.queued; CF.queued = false;
  if (q) run(q === "cov");
}
function setStatus(text, kind = "") { CF.status = text; CF.statusKind = kind; const s = $("cfgStatus"); if (s) { s.textContent = text; s.className = "cfgstatus " + kind; } }

// ---- the right pane: sector and UE settings, buttons, the UE table
function opts(list, v) { return list.map(o => `<option ${String(o) === String(v) ? "selected" : ""}>${o}</option>`).join(""); }
function cfgDrawPane() {
  const u = CF.ue, all = CF.gnb === "All", targets = gnbSectors();
  const same = k => { const v = [...new Set(targets.map(x => String(x[k])))]; return v.length === 1 ? v[0] : null; };
  const num = (k, step) => { const v = same(k); return `<input data-g="${k}" type="number" step="${step}" ${v == null ? 'placeholder="mixed"' : `value="${v}"`}>`; };
  const sel = (k, list) => { const v = same(k); return `<select data-g="${k}">${v == null ? '<option value="" selected>mixed</option>' : ""}${opts(list, v)}</select>`; };
  $("cfgPane").innerHTML = `<div class="cfgcols">
    <div><h3>gNB <select id="cfGnb">${["All", "A", "B", "C"].map(g => `<option value="${g}" ${g === CF.gnb ? "selected" : ""}>${g === "All" ? "All gNBs" : "gNB-" + g}</option>`).join("")}</select></h3>
      <div class="cfgform">
        <label>x (m)</label><input data-p="0" type="number" step="1" ${all ? 'disabled placeholder="per gNB"' : `value="${CF.gnbXY[CF.gnb][0]}"`}>
        <label>y (m)</label><input data-p="1" type="number" step="1" ${all ? 'disabled placeholder="per gNB"' : `value="${CF.gnbXY[CF.gnb][1]}"`}>
        <label>Height (m)</label>${num("height_m", 1)}
        <label>Power (dBm)</label>${num("power_dbm", 1)}
        <label>Tilt (°)</label>${num("downtilt_deg", 0.5)}
        <label>Beams</label>${num("num_beams", 1)}
        <label>Array</label>${sel("array", ["1x1", "4x4", "8x8", "16x16"])}
        <label>Pattern</label>${sel("pattern", ["iso", "dipole", "tr38901"])}
        <label>Pol.</label>${sel("polarization", ["V", "H", "cross"])}
      </div>
      <div class="cfgform cfgaz">${targets.map(x => `<label>${sn(x.name)} az (°)</label><input data-az="${x.name}" type="number" step="1" value="${x.azimuth_deg}">`).join("")}</div>
      <div id="cfgPosWarn" class="cfgstatus warn"></div></div>
    <div><h3>UE</h3>
      <div class="cfgform">
        <label>Pattern</label><select data-u="pattern">${opts(["iso", "dipole", "tr38901"], u.pattern)}</select>
        <label>Array</label><select data-u="array">${opts(["1x1", "1x2", "2x2", "4x4"], u.array)}</select>
        <label>Pol.</label><select data-u="polarization">${opts(["V", "H", "cross"], u.polarization)}</select>
        <label>Height (m)</label><input data-u="height_m" type="number" step="0.5" value="${u.height_m}">
        <label>NF (dB)</label><input data-u="noise_figure_db" type="number" step="0.5" value="${u.noise_figure_db}">
      </div></div>
    <div><h3>Run</h3>
      <div class="cfggrp"><span>Simulation</span><div>
        <select id="cfRays">${CF.defaults.ray_choices.map(r => `<option value="${r}" ${r === CF.rays ? "selected" : ""}>${raysText(r)}</option>`).join("")}</select>
        <button class="primary" id="cfRun">Run</button></div>
        <span>UEs</span><div>
        <input type="number" id="cfN" value="20" min="1" max="500" title="number of random UEs"><button id="cfRandom">Random UEs</button><button id="cfClear">Clear</button></div>
        <span>Settings</span><div><button id="cfDefaults">Defaults</button><button id="cfReset">Reset</button></div>
      </div>
      <div id="cfgCov"></div>
      <div id="cfgStatus" class="cfgstatus"></div>
      <div id="cfgDirty" class="cfgstatus warn" ${CF.dirty ? "" : "hidden"}>Changed: press Run</div>
    </div>
  </div>
  <div class="cfgres"><div id="cfgUETable"></div><div id="cfgUEDetail"></div></div>`;
  $("cfGnb").onchange = e => { CF.gnb = e.target.value; cfgDrawPane(); };
  document.querySelectorAll("#cfgPane [data-g]").forEach(i => i.onchange = () => {      // gNB level: its 3 sectors
    if (i.value === "") return;
    const k = i.dataset.g, v = i.type === "number" ? +i.value : i.value;
    gnbSectors().forEach(x => x[k] = v);
    markDirty();
  });
  document.querySelectorAll("#cfgPane [data-az]").forEach(i => i.onchange = () => {     // sector level: azimuth
    if (i.value === "") return;
    CF.sectors.find(x => x.name === i.dataset.az).azimuth_deg = +i.value; markDirty();
  });
  document.querySelectorAll("#cfgPane [data-p]").forEach(i => i.onchange = () => {      // gNB position
    if (i.value === "") return;
    CF.gnbXY[CF.gnb][+i.dataset.p] = +i.value; markDirty(); checkPosition(CF.gnb);
  });
  drawPosWarn();
  document.querySelectorAll("#cfgPane [data-u]").forEach(i => i.onchange = () => {
    CF.ue[i.dataset.u] = i.type === "number" ? +i.value : i.value; markDirty();
  });
  $("cfRays").onchange = e => { CF.rays = +e.target.value; markDirty(); };
  $("cfRun").onclick = () => run(true);
  $("cfRandom").onclick = async () => {
    try {
      const r = await api(`/random_ues?n=${+$("cfN").value}&seed=${CF.nextId}&scene=${twinScene()}`);
      r.ues.forEach(p => CF.ues.push({ id: "u" + CF.nextId++, x: p.x, y: p.y }));
      cfgDrawTable(); cfgDrawUEs(); frameCamera(CF.ues.map(u => [u.x, u.y])); run(false);
    } catch (e) { setStatus("Server error: " + e.message, "err"); }
  };
  $("cfClear").onclick = () => { CF.ues = []; CF.selected = null; cfgDrawTable(); cfgDrawUEs(); };
  $("cfReset").onclick = () => { CF.sectors = clone(CF.defaults.sectors); CF.gnbXY = clone(CF.defaults.gnb_xy); CF.posWarn = {}; CF.ue = clone(CF.defaults.ue); CF.rays = CF.defaults.rays; CF.dirty = false; cfgDrawAll(); run(true); };
  $("cfDefaults").onclick = () => { $("cfgDefaults").toggleAttribute("hidden"); cfgDrawDefaults(); };
  setStatus(CF.status, CF.statusKind);
  cfgDrawTable(); cfgDrawCoverage();
}
const gnbSectors = () => CF.sectors.filter(x => CF.gnb === "All" || x.name[0] === CF.gnb);
const moved = g => CF.gnbXY[g].some((v, i) => Math.abs(v - CF.defaults.gnb_xy[g][i]) > 1e-3);
// the sectors as sent to the server: x, y only for a moved gNB (otherwise config.py's position, as before)
function sectorsForRun() {
  return CF.sectors.map(x => moved(x.name[0]) ? { ...clone(x), x: CF.gnbXY[x.name[0]][0], y: CF.gnbXY[x.name[0]][1] } : clone(x));
}
async function checkPosition(g) {
  const [x, y] = CF.gnbXY[g];

  try {
    const r = await api(`/check_position?x=${x}&y=${y}&scene=${twinScene()}`);
    CF.posWarn[g] = !r.inside_area ? `gNB-${g}: outside the campus area` : r.inside_building ? `gNB-${g}: inside a building (roof ${r.roof_m} m)` : "";
  } catch (e) { CF.posWarn[g] = ""; }
  drawPosWarn();
}
function drawPosWarn() { const w = $("cfgPosWarn"); if (w) w.innerHTML = Object.values(CF.posWarn).filter(Boolean).map(esc).join("<br>"); }
function markDirty() { CF.dirty = true; $("cfgDirty").hidden = false; cfgDrawDefaults(); cfgDrawArrows(); }

const snAz = n => { const x = (CF.applied || CF).sectors.find(q => q.name === n); return x ? `${sn(n)} · ${x.azimuth_deg}°` : sn(n); };
function ueResult(id) { return CF.result ? CF.result.ues.find(r => r.id === id) : null; }
function cfgDrawTable() {
  if (!$("cfgUETable")) return;
  if (!CF.ues.length) { $("cfgUETable").innerHTML = `<div class="alert">Select a UE</div>`; $("cfgUEDetail").innerHTML = ""; return; }
  $("cfgUETable").innerHTML = `<h3>UEs (${CF.ues.length})</h3><table id="cfgTable"><tr><th>UE</th><th>serving</th><th>RSRP (dBm)</th><th>SINR (dB)</th><th>LOS</th><th>beam</th><th></th></tr>
    ${CF.ues.map(u => { const r = ueResult(u.id);
      return `<tr data-id="${u.id}" class="${u.id === CF.selected ? "sel" : ""}"><td>${u.id}${r && r.indoor ? " (indoor)" : ""}</td>
        <td>${r ? `<span class="dot" style="background:${siteColor(r.serving[0])}"></span>${snAz(r.serving)}` : "…"}</td>
        <td>${r ? fmt(r.rsrp_dbm[r.serving]) : "…"}</td><td>${r ? fmt(r.sinr_db) : "…"}</td>
        <td>${r ? (r.los[r.serving] ? "yes" : "no") : "…"}</td><td>${r && r.serving_beam_deg != null ? r.serving_beam_deg + "°" : "–"}</td>
        <td><button data-del="${u.id}" title="delete" style="padding:0 6px">×</button></td></tr>`; }).join("")}</table>`;
  document.querySelectorAll("#cfgTable tr[data-id]").forEach(tr => tr.onclick = e => {
    if (e.target.dataset.del) { removeUE(e.target.dataset.del); return; }
    CF.selected = tr.dataset.id; cfgDrawTable(); cfgDrawUEs();
  });
  const r = ueResult(CF.selected);
  $("cfgUEDetail").innerHTML = !r ? `<div class="alert">Select a UE</div>` : `<h3>${r.id} at (${r.x.toFixed(0)}, ${r.y.toFixed(0)}) m${r.indoor ? " (indoor)" : ""}</h3>
    <table><tr><th>sector</th><th>RSRP (dBm)</th><th>path</th><th>best beam</th></tr>

  campus.roads.visible = on.roads;

  if (sceneMapTex[s]) { map.material.map = sceneMapTex[s]; map.material.needsUpdate = true; }
  map.visible = LAY.heat && !cfg;
  if (typeof covMesh !== "undefined") covMesh.visible = LAY.heat && cfg && !!(CF && CF.coverage);
  ground.material.color.set(LAY.heat ? PLAIN : GRASS);
  document.body.classList.toggle("heat", LAY.heat);          // colour bars only with the heat map
  heatBtn.textContent = LAY.heat ? "Hide radio heat map" : "Show radio heat map";

}
heatBtn.onclick = () => { LAY.heat = !LAY.heat; applyLayers(); };

{
  const h = decodeURIComponent(location.hash), get = k => (h.match(new RegExp(k + "=([^&]+)")) || [])[1];
  if (get("heat") === "1") LAY.heat = true;
