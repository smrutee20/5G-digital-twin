<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SetuCity · learn telecoms in 3D</title>
<link rel="icon" href="assets/iitgn-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --glass: rgba(12, 17, 32, .84); --glass-2: rgba(22, 30, 52, .92); --line: rgba(255, 255, 255, .12);
  --ink: #f3f6fb; --ink-2: #aab6cc; --ink-3: #7f8ca3;
  --amber: #ffb224; --cyan: #37d5ff; --green: #3ddc97; --violet: #a78bfa; --pink: #ff6b9a;
  --display: "Outfit", "Segoe UI", system-ui, sans-serif; --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --top: 56px; --r: 18px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #0b1020; color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#shade { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(8, 12, 26, .5), rgba(8, 12, 26, .8)); opacity: 0; pointer-events: none; transition: opacity .6s; }
body[data-view="splash"] #shade, body[data-view="learn"] #shade, body[data-view="path"] #shade, body[data-view="quiz"] #shade { opacity: 1; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- top bar */
#top { position: fixed; inset: 0 0 auto 0; height: var(--top); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 16px; background: rgba(10, 14, 28, .9); border-bottom: 1px solid var(--line); z-index: 30; }
.brand { display: flex; align-items: center; gap: 9px; font: 800 1.32rem/1 var(--display); letter-spacing: -.01em; color: var(--ink); text-decoration: none; justify-self: start; }
.brand b { color: var(--amber); font-weight: 800; }
.brand svg { width: 28px; height: 28px; }
#crumb { font: 700 1.12rem/1.1 var(--display); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; position: relative; }
#crumb button { font: inherit; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; }
#crumb button:hover { background: rgba(255, 255, 255, .08); }
.tools { display: flex; gap: 8px; justify-self: end; align-items: center; }
.tbtn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font: 600 .88rem var(--display); white-space: nowrap; }
.tbtn:hover { background: rgba(255, 255, 255, .16); }
.tbtn.sq { width: 36px; padding: 0; justify-content: center; }
#pathMenu { position: fixed; top: calc(var(--top) + 6px); left: 50%; transform: translateX(-50%); padding: 6px; z-index: 40; min-width: 250px; }
#pathMenu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; text-align: left; font: 600 .95rem var(--display); }
#pathMenu button:hover { background: rgba(255, 255, 255, .1); }
#pathMenu i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#pathMenu small { margin-left: auto; color: var(--ink-3); font: 500 .78rem var(--body); }

/* ---------- splash */
#splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 20px; text-align: center; padding: 24px; z-index: 25; }
#splash h1 { font: 800 clamp(3rem, 11vw, 7.2rem)/.95 var(--display); letter-spacing: -.035em; text-shadow: 0 8px 40px rgba(0, 0, 0, .5); }
#splash h1 b { color: var(--amber); }
#splash p { font: 500 clamp(1rem, 2.2vw, 1.3rem)/1.4 var(--display); color: #dbe4f3; max-width: 34ch; text-wrap: balance; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; gap: 9px; height: 50px; padding: 0 24px; border-radius: 14px; font: 700 1.02rem var(--display); background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); transition: transform .15s, background .15s; }
.btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .2); }
.btn.pri { background: var(--amber); color: #1a1202; border-color: transparent; }
.btn.pri:hover { background: #ffc24d; }
.btn.sm { height: 38px; padding: 0 16px; font-size: .9rem; border-radius: 11px; }
.credit { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 8px 18px 8px 8px; border-radius: 999px; background: rgba(10, 14, 28, .72); border: 1px solid var(--line); font: 500 .98rem var(--display); color: #dbe4f3; }
.credit img { width: 44px; height: 44px; border-radius: 50%; background: #fff; padding: 3px; }
.credit b { color: #fff; font-weight: 700; }
.brand .inst { width: 34px; height: 34px; border-radius: 50%; background: #fff; padding: 2px; margin-left: 6px; }

/* ---------- loading screen */
#boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center;
  background: radial-gradient(ellipse at 50% 38%, #16224a 0%, #0b1020 62%, #070a16 100%); transition: opacity .7s ease, visibility .7s; }
#boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
#boot .seal { position: relative; width: clamp(120px, 26vw, 176px); aspect-ratio: 1; border-radius: 50%; background: #fff; padding: 10px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .2), 0 18px 60px rgba(0, 0, 0, .55); margin-bottom: 8px; animation: rise .8s ease both; }
#boot .seal img { width: 100%; height: 100%; display: block; }
#boot .seal::before, #boot .seal::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--cyan); opacity: 0; animation: ping 2.6s ease-out infinite; }
#boot .seal::after { animation-delay: 1.3s; border-color: var(--amber); }
#boot h1 { font: 800 clamp(2.4rem, 8vw, 4.2rem)/1 var(--display); letter-spacing: -.03em; animation: rise .8s .12s ease both; }
#boot h1 b { color: var(--amber); }
#boot .by { font: 500 clamp(1rem, 2.6vw, 1.25rem) var(--display); color: #dbe4f3; animation: rise .8s .24s ease both; }
#boot .by b { color: #fff; font-weight: 700; }
#boot .load { width: min(300px, 70vw); height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; margin-top: 16px; }
#boot .load i { display: block; width: 4%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), var(--amber)); transition: width .5s ease; }
#boot .msg { font: 500 .9rem var(--display); color: var(--ink-2); min-height: 1.4em; }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.55); opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- study mode: path circles */
#learn { position: fixed; inset: var(--top) 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 18px 12px 28px; z-index: 20; overflow: auto; }
#learn > h2 { font: 700 1.5rem var(--display); }
#learn > p { color: var(--ink-2); font: 500 1rem var(--display); margin-top: -18px; text-align: center; }
#paths { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 22px; max-width: 1180px; }
.pcircle { --p: 0; --c: var(--amber); position: relative; width: 132px; height: 132px; border-radius: 50%; display: grid; place-content: center; justify-items: center; gap: 5px; text-align: center; padding: 14px;
  background: radial-gradient(circle, rgba(12, 17, 32, .92) 62%, transparent 63%), conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255, 255, 255, .85) 0); transition: transform .18s; }
.pcircle::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: rgba(12, 17, 32, .9); z-index: 0; transition: background .18s; }
.pcircle > * { position: relative; z-index: 1; }
.pcircle b { font: 700 .98rem/1.12 var(--display); text-wrap: balance; }
.pcircle small { font: 600 .74rem var(--display); color: var(--ink-2); }
.pcircle:hover, .pcircle:focus-visible, .pcircle.on { transform: scale(1.07); }
.pcircle:hover::before, .pcircle:focus-visible::before, .pcircle.on::before { background: color-mix(in srgb, var(--c) 82%, #000); }
.pcircle:hover b, .pcircle.on b, .pcircle:focus-visible b { color: #0b1020; }
.pcircle:hover small, .pcircle.on small, .pcircle:focus-visible small { color: #0b1020cc; }
.pcircle .done { position: absolute; top: 2px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #06281a; display: grid; place-items: center; z-index: 2; }
#pdesc { min-height: 76px; max-width: 520px; text-align: center; padding: 14px 20px; font: 500 .98rem/1.45 var(--display); background: #fff; color: #141a2c; border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .4); }
#pdesc b { display: block; font-weight: 700; margin-bottom: 2px; }

/* ---------- path timeline */
#path { position: fixed; inset: var(--top) 0 0 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; z-index: 20; padding-bottom: 30px; }
#track { display: flex; gap: 26px; overflow-x: auto; padding: 22px max(24px, calc(50vw - 560px)) 14px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--c, var(--amber)) rgba(255, 255, 255, .12); }
.lesson { flex: none; width: 210px; display: grid; justify-items: center; gap: 0; scroll-snap-align: center; position: relative; }
.lcard { width: 100%; border-radius: 18px; overflow: hidden; background: #fff; color: #141a2c; text-align: center; box-shadow: 0 12px 34px rgba(0, 0, 0, .4); transition: transform .18s; display: block; padding: 0; }
.lcard img, .lcard .ph { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #1a2340; }
.lcard span { display: block; padding: 10px 10px 12px; font: 700 .95rem/1.2 var(--display); text-wrap: balance; }
.lcard small { display: block; font: 600 .72rem var(--display); color: #5b6781; margin-top: 3px; }
.lesson:not(.locked) .lcard:hover { transform: translateY(-5px); }
.lesson.locked .lcard { background: rgba(40, 48, 70, .82); color: #cfd6e4; }
.lesson.locked .lcard img { filter: grayscale(1) brightness(.5); }
.lesson.quiz .lcard { background: #1c2236; color: #fff; display: grid; place-content: center; aspect-ratio: 16 / 13.6; font: 700 1.15rem var(--display); border: 1px solid var(--line); }
.lesson .stem { width: 2px; height: 30px; background: rgba(255, 255, 255, .5); }
.lesson .node { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #141a2c; display: grid; place-items: center; z-index: 1; border: 3px solid #fff; }
.lesson.done .node { background: var(--green); border-color: #fff; color: #06281a; }
.lesson.done .stem { background: var(--green); }
.lesson.locked .node { background: #232a40; color: #cfd6e4; border-color: #8f9ab3; }
.lesson::after { content: ""; position: absolute; left: 50%; bottom: 15px; width: calc(100% + 26px); height: 3px; background: rgba(255, 255, 255, .35); }
.lesson.done::after { background: var(--green); }
.lesson:last-child::after { display: none; }
.lesson .ic { width: 17px; height: 17px; stroke-width: 2.6; }
#pbar { height: 5px; margin: 0 max(24px, calc(50vw - 560px)); background: rgba(255, 255, 255, .16); border-radius: 3px; overflow: hidden; }
#pbar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .5s; }
#phead { text-align: center; padding: 0 20px; }
#phead p { color: #dbe4f3; font: 500 1rem/1.4 var(--display); max-width: 62ch; margin: 0 auto; text-wrap: balance; }

/* ---------- story chip, bottom card */
#chip { position: fixed; top: calc(var(--top) + 12px); left: 62px; padding: 8px 14px 10px; z-index: 22; max-width: min(360px, calc(100vw - 150px)); border-radius: 12px; }
#chip small { display: block; font: 600 .72rem var(--display); color: var(--ink-2); }
#chip b { font: 700 1.08rem/1.15 var(--display); }
#chip .nav { display: flex; gap: 8px; margin-top: 8px; }
#story { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(980px, calc(100vw - 24px)); z-index: 22; overflow: hidden; }
#story .row { display: flex; align-items: stretch; }
#story .arrow { flex: none; width: 54px; display: grid; place-items: center; color: var(--ink); }
#story .arrow:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
#story .arrow:disabled { opacity: .25; cursor: default; }
#story .txt { flex: 1; padding: 16px 6px 14px; min-width: 0; }
#story h3 { font: 700 1.22rem/1.2 var(--display); margin-bottom: 5px; }
#story p { font: 400 .98rem/1.5 var(--body); color: #e3e9f4; max-width: 70ch; }
#story .art { flex: none; width: 330px; padding: 10px 0 6px 12px; display: grid; place-items: center; cursor: zoom-in; border-radius: 12px; }
#story .art:hover { background: rgba(255, 255, 255, .06); }
#help .box.zoom { width: min(900px, 100%); padding: 18px; cursor: zoom-out; }
#help .box.zoom svg { width: 100%; height: auto; }
#story .art svg { width: 100%; height: auto; }
#story .foot { display: flex; align-items: center; gap: 12px; padding: 0 16px 12px; }
#story .count { font: 700 .86rem var(--display); color: var(--ink-2); min-width: 34px; }
#story .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; }
#story .bar i { display: block; height: 100%; background: var(--amber); border-radius: 3px; transition: width .35s; }
#story .fin { background: var(--green); color: #06281a; }
.ibtn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); }
.ibtn:hover { background: rgba(255, 255, 255, .18); }
.ibtn.on { background: var(--amber); color: #1a1202; border-color: transparent; }

/* ---------- info card */
#card { position: fixed; top: calc(var(--top) + 78px); left: 62px; width: min(380px, calc(100vw - 76px)); max-height: calc(100vh - var(--top) - 250px); overflow: auto; padding: 14px 18px 18px; z-index: 24; }
#card .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
#card .badge { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #06281a; display: grid; place-items: center; font: 800 .9rem var(--display); }
#card .hd .ibtn:first-of-type { margin-left: auto; }
#card h3 { font: 700 1.16rem/1.2 var(--display); margin-bottom: 6px; }
#card p { font-size: .95rem; color: #e3e9f4; }
#card .pic { margin-top: 12px; border-radius: 12px; overflow: hidden; background: #0e1528; }
#card .pic img { width: 100%; display: block; }
#card .pic svg { width: 100%; height: auto; padding: 8px; cursor: zoom-in; }
body[data-view="explore"]:not(.instory) #card { top: calc(var(--top) + 14px); }

/* ---------- hotspots and labels */
#pins { position: fixed; inset: 0; pointer-events: none; z-index: 12; overflow: hidden; }
.pin { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -44px 0 0 -17px; border-radius: 50% 50% 50% 4px; rotate: -45deg; pointer-events: auto; background: var(--c); color: #0b1020; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .45); border: 2px solid #fff; transition: scale .15s; will-change: translate; }
.pin > .ic, .pin > span { rotate: 45deg; width: 17px; height: 17px; stroke-width: 2.4; font: 800 .95rem/17px var(--display); text-align: center; }
.pin:hover, .pin:focus-visible { scale: 1.2; z-index: 5; }
.pin.seen { background: #10182c; color: var(--c); border-color: var(--c); }
.pin.inner { width: 28px; height: 28px; margin: -36px 0 0 -14px; background: #10182c; color: #fff; border-color: #fff; }
.pin.inner.seen { color: var(--green); border-color: var(--green); }
.tip { position: absolute; left: 0; top: 0; width: 270px; padding: 10px 14px 12px; pointer-events: none; z-index: 14; border-radius: 14px; }
.tip small { display: block; font: 600 .72rem var(--display); color: var(--c); }
.tip b { display: block; font: 700 1.02rem/1.2 var(--display); margin-bottom: 3px; }
.tip span { font-size: .84rem; line-height: 1.4; color: #dbe4f3; display: block; }
.tag { position: absolute; left: 0; top: 0; padding: 5px 12px 6px; border-radius: 9px; background: var(--c); color: #0b1020; font: 700 .86rem/1.1 var(--display); white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); transform: translate(-50%, calc(-100% - 12px)); will-change: translate; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: inherit; rotate: 45deg; translate: -50% 0; border-radius: 2px; }

/* ---------- explore HUD */
#zoom { position: fixed; left: 14px; top: calc(var(--top) + 14px); width: 36px; padding: 8px 0; display: grid; justify-items: center; gap: 6px; z-index: 21; border-radius: 12px; }
#zoom button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
#zoom button:hover { background: rgba(255, 255, 255, .14); }
#zoom input { writing-mode: vertical-lr; direction: rtl; width: 20px; height: 96px; accent-color: #fff; }
#dock { position: fixed; left: 14px; bottom: 16px; display: flex; gap: 8px; align-items: center; z-index: 21; }
#dock .tbtn { background: var(--glass); border-radius: 12px; height: 38px; }
#dock .tbtn.sq { width: 38px; }
#dock .tbtn:hover { background: var(--glass-2); }
#dock .tbtn.on { background: var(--amber); color: #1a1202; }
#viewer { position: fixed; right: 14px; bottom: 16px; display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 14px; z-index: 21; border-radius: 12px; font: 700 .84rem var(--display); }
#viewer .k { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 8px; font: 700 .84rem var(--display); }
#viewer .k:hover { background: rgba(255, 255, 255, .12); }
#viewer .k.off { opacity: .4; }
#viewer .k i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); color: #0b1020; display: grid; place-items: center; }
#viewer .k i .ic { width: 11px; height: 11px; stroke-width: 3; }
#viewer .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
body.instory #viewer { bottom: auto; top: calc(var(--top) + 12px); }
@media (max-width: 1240px) { body.instory #dock { display: none; } }
#layers { position: fixed; left: 14px; bottom: 62px; padding: 12px 14px; z-index: 23; display: grid; gap: 4px; min-width: 216px; }
#layers h4 { margin: 0 0 4px; font: 700 .78rem var(--display); color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
#layers label { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-radius: 8px; font: 600 .9rem var(--display); cursor: pointer; }
#layers label:hover { background: rgba(255, 255, 255, .08); }
#layers input { accent-color: var(--amber); width: 16px; height: 16px; }
#hint { position: fixed; left: 50%; top: calc(var(--top) + 14px); transform: translateX(-50%); padding: 9px 16px; font: 600 .88rem var(--display); color: #dbe4f3; z-index: 20; border-radius: 12px; pointer-events: none; transition: opacity .5s; white-space: nowrap; }

/* ---------- menu, help, toast */
#menu { position: fixed; top: calc(var(--top) + 8px); right: 12px; width: 290px; padding: 8px; z-index: 45; display: grid; gap: 2px; }
#menu button, #menu a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font: 600 .93rem var(--display); color: var(--ink); text-decoration: none; text-align: left; width: 100%; }
#menu button:hover, #menu a:hover { background: rgba(255, 255, 255, .1); }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 6px; }
#menu .state { margin-left: auto; font: 600 .78rem var(--display); color: var(--ink-3); }
#menu .state.on { color: var(--green); }
#help { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(6, 9, 20, .6); padding: 16px; }
#help .box { width: min(560px, 100%); padding: 22px 24px; max-height: 90vh; overflow: auto; }
#help h3 { font: 700 1.3rem var(--display); margin-bottom: 12px; }
#help dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 16px; font-size: .93rem; }
#help dt { font: 700 .88rem var(--display); color: var(--amber); white-space: nowrap; }
#help dd { margin: 0; color: #dbe4f3; }
#toast { position: fixed; left: 50%; top: calc(var(--top) + 16px); transform: translateX(-50%); padding: 10px 18px; z-index: 60; font: 700 .95rem var(--display); border-radius: 12px; background: var(--green); color: #06281a; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }

/* ---------- quiz */
#quiz { position: fixed; inset: var(--top) 0 0 0; z-index: 26; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 22px; overflow: auto; }
#quiz .qtop { width: min(880px, 100%); display: flex; align-items: center; gap: 12px; margin-bottom: 4vh; }
#quiz .qtop b { flex: 1; text-align: center; font: 700 1.2rem var(--display); }
#quiz .qtop span { font: 700 .86rem var(--display); color: var(--ink-2); min-width: 72px; text-align: right; }
#qbody { width: min(880px, 100%); display: grid; gap: 18px; justify-items: center; margin: auto 0; }
#qbody h3 { font: 600 clamp(1.15rem, 2.4vw, 1.5rem)/1.3 var(--display); text-align: center; text-wrap: balance; max-width: 30em; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; width: 100%; }
.opt { padding: 15px 18px; border-radius: 14px; text-align: left; font: 600 1rem/1.3 var(--display); background: rgba(16, 22, 40, .9); border: 2px solid rgba(255, 255, 255, .28); transition: background .15s, border-color .15s; display: flex; gap: 12px; align-items: center; }
.opt:hover:not(:disabled) { background: rgba(40, 52, 86, .95); border-color: #fff; }
.opt.sel { border-color: var(--amber); background: rgba(70, 52, 14, .92); }
.opt.right { border-color: var(--green); background: rgba(16, 70, 48, .95); }
.opt.wrong { border-color: var(--pink); background: rgba(80, 24, 44, .95); }
.opt:disabled { cursor: default; }
.opt i { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font: 700 .85rem var(--display); font-style: normal; }
.order { display: grid; gap: 9px; width: min(620px, 100%); }
.order .opt { cursor: grab; user-select: none; }
.order .opt.drag { opacity: .4; }
.order .opt .mv { margin-left: auto; display: flex; gap: 4px; }
.order .opt .mv button { width: 30px; height: 30px; border-radius: 8px; background: rgba(255, 255, 255, .1); display: grid; place-items: center; }
.order .opt .mv button:hover { background: rgba(255, 255, 255, .25); }
.qhint { font: 500 .9rem var(--display); color: var(--ink-2); }
.why { padding: 12px 18px; font-size: .96rem; max-width: 620px; text-align: center; border-radius: 14px; }
.why b { font-family: var(--display); }
.score { font: 800 4rem/1 var(--display); color: var(--amber); }

@media (max-width: 760px) {
  :root { --top: 50px; }
  .brand > span { display: none; }
  #crumb { font-size: .98rem; max-width: 52vw; }
  #modeBtn span { display: none; } #modeBtn { width: 36px; padding: 0; justify-content: center; }
  .pcircle { width: 104px; height: 104px; padding: 10px; } .pcircle b { font-size: .8rem; } .pcircle small { font-size: .68rem; }
  #paths { gap: 12px; } #learn { justify-content: flex-start; gap: 18px; } #pdesc { font-size: .9rem; }
  .lesson { width: 168px; } #track { gap: 18px; } .lesson::after { width: calc(100% + 18px); }
  #story .art { display: none; } #story .arrow { width: 40px; } #story h3 { font-size: 1.05rem; } #story p { font-size: .9rem; }
  #story { bottom: 8px; } #chip { left: 12px; top: calc(var(--top) + 8px); } #zoom { display: none; }
  #card { left: 8px; top: calc(var(--top) + 70px); width: calc(100vw - 16px); max-height: 46vh; }
  #viewer { right: 8px; bottom: 8px; padding-left: 8px; } #viewer > span:first-child, #viewer .sep, #viewer #toggleAll, #nightBtn, #hdBtn { display: none; }
  #dock { left: 8px; bottom: 8px; } #layers { left: 8px; bottom: 54px; } #hint { display: none; }
  body.instory #viewer { top: calc(var(--top) + 8px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
