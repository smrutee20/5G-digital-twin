    max_depth: 3
    samples_per_src: 1391715
    diffraction: true
    edge_diffraction: true
    diffuse_reflection: false
  physical:
    max_depth: 4
    samples_per_src: 4639053
    diffraction: true
    edge_diffraction: true
    diffuse_reflection: false
  fill:                     # links with no path, or > weak_db below 38.901 UMa-NLOS, get the 38.901 fill
    weak_db: 18.0           # 3 x the 6 dB UMa-NLOS shadow-fading sigma (TR 38.901 Table 7.4.1-1)
    shadow_db: 6.0          # log-normal shadowing added to filled links
physical_impairments:
  ue_position_error_m: 5.0
  shadowing_std_db: 4.0
  fast_fading: rayleigh_on_nlos
  permittivity_scale: 1.4
  conductivity_scale: 2.0
experiments:
  pool_size: 1500
  num_ues: 30
  num_drops: 30
  num_slots: 40
  coverage_cell_m: 5.0
e2e:                        # end-to-end flow layer (dt/e2e/, experiments/e09_e2e_flow.py)
  num_ues: 30
  drop: 0                   # same UE drop as e03 drop 0, so the radio part can be checked against t6
  seed: 0
  duration_ms: 1000
  attach_start_ms: 10       # after F1/E1/NG set-up and NF registration
  attach_window_ms: 200     # UEs power on at random times in this window
  epoch_slots: 40           # DU scheduling epoch: T3 runs once per 40 slots (20 ms)
  traffic:                  # downlink stream per UE from the DN server (identical for B1 and T3)
    model: poisson
    rate_mbps: 10           # e.g. a 4K video stream
    packet_bytes: 1400
  air:
    harq_rtt_ms: 2.0        # HARQ round trip at 30 kHz SCS (assumption)
    max_harq_retx: 3        # retransmissions per packet ~ geometric with p = carrier.bler_target
  mobility:                 # experiments/e11: the three e05 walks, one moving UE each, + static UEs
    speed_mps: 1.4          # pedestrian; one 2 m step every 1.43 s
    walk_start_ms: 1500     # after attach + PDU session
    a3_offset_db: 3.0       # A3: neighbour RSRP > serving + offset (as in e05) ...
    ttt_steps: 2            # ... for 2 consecutive steps (time-to-trigger, as in e05)
    static_ues: 27
    ue_rrc_processing_ms: 10  # RRC reconfiguration procedural delay before the UE acts (TS 38.331 §12)
    prach_period_ms: 10       # random-access occasions on the target cell (PRACH configuration period)
  site_off:                 # experiments/e11 what-if: one site switched off without warning
    site: B
    t_ms: 1500
    rlf_ms: 400             # radio-link-failure detection (N310 + T310), assumption
    duration_ms: 3500
  pdb_ms: 300               # 5QI 9 packet delay budget, UE <-> UPF N6 termination (TS 23.501 Table 5.7.4-1)
  du_buffer_bytes: 4000000  # RLC buffer per UE in the DU; overflow is counted as dropped
  tac: 1                    # tracking area of all 9 cells
  default_qos:              # PCF default for DNN 'internet': QoS flow QFI 1
    five_qi: 9              # non-GBR, priority 90, 300 ms PDB, PER 1e-6 (TS 23.501 Table 5.7.4-1)
    arp_priority: 8
    session_ambr_dl_mbps: 1000
    session_ambr_ul_mbps: 500
  upfs:                     # UPF candidates the SMF selects from (DNN, slice, locality, then load)
    - {name: UPF-EDGE, dnn: [internet], sst: [1], tai: [1], max_sessions: 20, n3_ip: 10.100.1.1, ue_pool: 10.45.0.0/16}
    - {name: UPF-CENTRAL, dnn: [internet, ims], sst: [1, 2], tai: [], max_sessions: 1000, n3_ip: 10.100.2.1, ue_pool: 10.46.0.0/16}
  latency_ms:               # one-way transport latency per interface (assumptions)
    Uu: slot-aligned        # next slot boundary + one 0.5 ms slot
    fronthaul: 0.1
    F1: 0.5
    E1: 0.5
    Xn: 1.0                 # gNB <-> gNB (Xn-C, Xn-U)
    N2: 1.0
    N3: 1.0
    N4: 1.0
    N6: 5.0
    SBI: 1.0
  processing_ms:            # processing time per message at the receiving element (assumptions)
    UE: 1.0
    RU: 0.05
    DU: 0.2
    CU-CP: 0.5
    CU-UP: 0.2
    AMF: 1.0
    SMF: 1.0
    UPF: 0.05
    AUSF: 1.0
    UDM: 1.0
    NRF: 0.5
    PCF: 1.0
    DN: 0.5
